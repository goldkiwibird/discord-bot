<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby</title>
<style>
  /* 대전 화면(match_page.html)과 같은 색·같은 우측 패널 구조를 쓴다 — 두 화면을 오가므로
     여기서만 다른 팔레트를 쓰면 다른 사이트처럼 보인다. */
  :root {
    --bg: #11131a; --panel: #1c1f29; --line: #2e3342; --text: #e7e9ee; --dim: #8d94a5;
    --accent: #5865f2; --ok: #3ddc84; --bad: #ff4d4f; --gold: #ffc53d; --view: #3ddccf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font-family: "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  [hidden] { display: none !important; }

  #app { display: grid; grid-template-columns: 1fr 260px; height: 100%; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; } .panel { display: none; } }

  /* ── 본문: 필터 + 방 목록 ─────────────────── */
  .main { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  .titlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; }
  .mypoints { font-size: 13px; color: var(--gold); margin-left: auto; }
  .create { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent);
            color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .create:hover { filter: brightness(1.1); }
  /* 목록은 자동으로 갱신되지 않는다 (아래 connect() 주석 참고) — 이 버튼이 유일한 갱신 수단이다. */
  .refresh { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--ok);
             background: transparent; color: var(--ok); font-size: 13px; cursor: pointer;
             font-family: inherit; }
  .refresh:hover:not(:disabled) { background: var(--ok); color: #10121a; }
  .refresh:disabled { opacity: .4; cursor: default; }
  .stamp { font-size: 11px; color: var(--dim); }

  /* 필터 한 줄. 좁은 화면에서는 알아서 감긴다. */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input, .field select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  .field input[type="number"] { width: 90px; }
  .field .range { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
  .search { min-width: 180px; }

  .rooms { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; display: flex;
           flex-direction: column; gap: 10px; }
  .room { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .room .rname { font-size: 15px; font-weight: 600; }
  .room .host { font-size: 13px; color: var(--dim); }
  .room .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line);
         color: var(--dim); }
  .tag.wager { color: var(--gold); border-color: var(--gold); }
  .tag.friendly { color: var(--view); border-color: var(--view); }
  .tag.private { color: var(--dim); }
  .tag.playing { color: var(--bad); border-color: var(--bad); }
  .room .people { font-size: 13px; color: var(--dim); margin-left: auto; }
  .room .join { padding: 6px 16px; border-radius: 7px; border: 1px solid var(--accent);
                background: transparent; color: var(--accent); font-size: 13px; cursor: pointer; }
  .room .join:hover { background: var(--accent); color: #fff; }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }

  /* ── 우측 패널: 접속 인원 + 로비 접속자 ───── */
  .panel { background: var(--panel); border-left: 1px solid var(--line); padding: 14px;
           display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .online { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .online .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                 background: var(--ok); margin-right: 8px; vertical-align: middle; }
  .online.off .dot { background: var(--bad); }
  .inrooms { font-size: 12px; color: var(--dim); }
  .panel h2 { margin: 6px 0 0; font-size: 12px; color: var(--dim); font-weight: 600; }
  .users { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .user { font-size: 13px; padding: 5px 8px; border-radius: 6px; background: var(--bg); }
  .user.me { color: var(--accent); font-weight: 600; }

  /* ── 겹쳐 뜨는 창 (방 만들기 / 비밀번호 / 초대) ── */
  .veil { position: fixed; inset: 0; background: rgba(8,9,13,.72); display: flex;
          align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 18px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .dialog h3 { margin: 0; font-size: 16px; }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog select {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  .dialog input[type="text"], .dialog input[type="number"], .dialog input[type="password"] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font-size: 14px; font-family: inherit; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
         background: transparent; color: var(--text); font-size: 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .err { font-size: 12px; color: var(--bad); min-height: 16px; }

  /* 초대 알림 — 화면 오른쪽 아래에 쌓인다 */
  .invites { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column;
             gap: 8px; z-index: 30; }
  .invite { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
            padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,.5); max-width: 300px; }
  .invite .who { font-size: 13px; }
  .invite .row { display: flex; gap: 8px; justify-content: flex-end; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 16px; font-size: 13px; z-index: 40; }
  .toast.bad { border-color: var(--bad); color: var(--bad); }
  .notice { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
            justify-content: center; padding: 24px; text-align: center; font-size: 15px;
            color: var(--dim); z-index: 50; }
</style>
</head>
<body>
<div id="app">
  <div class="main">
    <header>
      <div class="titlerow">
        <h1 id="title">—</h1>
        <button class="create" id="createBtn" hidden></button>
        <button class="refresh" id="refreshBtn" hidden></button>
        <span class="stamp" id="stamp"></span>
        <span class="mypoints" id="mypoints"></span>
      </div>
      <div class="filters" id="filters" hidden>
        <div class="field">
          <label id="lblVisibility"></label>
          <select id="fVisibility"></select>
        </div>
        <div class="field">
          <label id="lblWager"></label>
          <div class="range">
            <input type="number" id="fWagerMin" min="0" placeholder="0">
            <span>~</span>
            <input type="number" id="fWagerMax" min="0" placeholder="∞">
          </div>
        </div>
        <div class="field search">
          <label id="lblSearch"></label>
          <input type="text" id="fSearch">
        </div>
      </div>
    </header>
    <div class="rooms" id="rooms"></div>
  </div>

  <aside class="panel">
    <div>
      <div class="online" id="online"><span class="dot"></span><span id="onlineCount">0</span></div>
      <div class="inrooms" id="inrooms"></div>
    </div>
    <h2 id="usersLabel"></h2>
    <div class="users" id="users"></div>
  </aside>
</div>

<div class="invites" id="invites"></div>

<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("token") || "";
// **이 페이지의 id.** 새로고침하거나 창을 새로 열면 달라진다. 서버는 이걸로
// '같은 페이지의 재연결'과 '다른 창'을 구분한다 — 구분이 없으면 프록시가 연결을 끊고
// 브라우저가 자동으로 다시 붙을 때마다 "다른 창에서 접속했습니다"가 뜬다.
const CID = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

let data = null;      // 문구/설정 (한 번만 받는다)
let state = null;     // 로비 스냅샷
let stopped = false;  // 만료·정원초과·유휴 정리 등으로 끝난 상태

const msg = (key, vars = {}) =>
  (data.messages[key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(text, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function fullScreenNotice(text) {
  stopped = true;
  const el = document.createElement("div");
  el.className = "notice";
  el.textContent = text;
  document.body.appendChild(el);
}

// ── 필터 ───────────────────────────────────────────────────────────────────
const filters = { visibility: "all", min: null, max: null, search: "" };

function readFilters() {
  filters.visibility = $("fVisibility").value;
  const min = parseInt($("fWagerMin").value, 10);
  const max = parseInt($("fWagerMax").value, 10);
  filters.min = Number.isFinite(min) ? min : null;
  filters.max = Number.isFinite(max) ? max : null;
  filters.search = $("fSearch").value.trim().toLowerCase();
  renderRooms();
}

function matchesFilters(room) {
  if (filters.visibility === "public" && room.private) return false;
  if (filters.visibility === "private" && !room.private) return false;
  if (filters.min !== null && room.wager < filters.min) return false;
  if (filters.max !== null && room.wager > filters.max) return false;
  if (filters.search) {
    const hay = (room.name + " " + room.host).toLowerCase();
    if (!hay.includes(filters.search)) return false;
  }
  return true;
}

// ── 그리기 ─────────────────────────────────────────────────────────────────
function renderRooms() {
  const box = $("rooms");
  box.innerHTML = "";
  const all = state ? state.rooms : [];
  if (!all.length) {
    box.innerHTML = `<div class="empty">${escapeHtml(data.messages.web_lobby_rooms_empty)}</div>`;
    return;
  }
  const shown = all.filter(matchesFilters);
  if (!shown.length) {
    box.innerHTML = `<div class="empty">${escapeHtml(data.messages.web_lobby_filter_none)}</div>`;
    return;
  }
  for (const room of shown) {
    const el = document.createElement("div");
    el.className = "room";
    const tags = [];
    tags.push(room.wager
      ? `<span class="tag wager">${msg("web_room_wager", { points: room.wager.toLocaleString() })}</span>`
      : `<span class="tag friendly">${escapeHtml(data.messages.web_room_friendly)}</span>`);
    if (room.private) tags.push(`<span class="tag private">${escapeHtml(data.messages.web_room_private)}</span>`);
    if (room.playing) tags.push(`<span class="tag playing">${escapeHtml(data.messages.web_room_playing)}</span>`);

    el.innerHTML =
      `<div>
         <div class="rname">${escapeHtml(room.name)}</div>
         <div class="host">${escapeHtml(data.messages.web_room_host)} ${escapeHtml(room.host)}</div>
       </div>
       <div class="tags">${tags.join("")}</div>
       <span class="people">${msg("web_room_people", { count: room.people })}</span>
       <button class="join">${escapeHtml(data.messages.web_lobby_join)}</button>`;
    el.querySelector(".join").onclick = () => tryJoin(room);
    box.appendChild(el);
  }
}

function renderUsers() {
  $("onlineCount").textContent = state.online;
  $("inrooms").textContent = msg("web_lobby_in_rooms", { count: state.in_rooms });
  const box = $("users");
  box.innerHTML = "";
  if (!state.users.length) {
    box.innerHTML = `<div class="empty">${escapeHtml(data.messages.web_lobby_users_empty)}</div>`;
    return;
  }
  for (const user of state.users) {
    const el = document.createElement("div");
    el.className = "user" + (user.id === data.me.id ? " me" : "");
    el.textContent = user.name;
    box.appendChild(el);
  }
}

let invites = [];      // 스트림으로 도착한 초대 (목록 갱신과 무관하게 바로 뜬다)

function renderInvites() {
  const box = $("invites");
  box.innerHTML = "";
  for (const invite of invites) {
    const el = document.createElement("div");
    el.className = "invite";
    el.innerHTML =
      `<div class="who">${msg("web_lobby_invited", { name: escapeHtml(invite.host) })}</div>
       <div class="who">${escapeHtml(invite.name)}</div>
       <div class="row">
         <button class="btn" data-no>${escapeHtml(data.messages.web_lobby_invite_decline)}</button>
         <button class="btn primary" data-yes>${escapeHtml(data.messages.web_lobby_invite_accept)}</button>
       </div>`;
    el.querySelector("[data-yes]").onclick = () => join(invite.room_id, "");
    el.querySelector("[data-no]").onclick = () => {
      invites = invites.filter((x) => x !== invite);
      el.remove();
    };
    box.appendChild(el);
  }
}

function render() {
  renderRooms();
  renderUsers();
  renderInvites();
}

// 목록 갱신. 서버도 같은 간격을 강제하므로 버튼을 우회해도 소용없다.
let cooling = false;
async function refresh(quiet) {
  if (cooling) return;
  const res = await fetch(`/api/lobby?token=${encodeURIComponent(token)}`);
  const body = await res.json().catch(() => ({}));
  if (res.status === 429) {
    if (!quiet) toast(msg("web_lobby_refresh_wait", { seconds: Math.ceil(body.retry_after || 5) }));
    startCooldown(Math.ceil(body.retry_after || 5));
    return;
  }
  if (!res.ok) {
    fullScreenNotice(data.messages.web_lobby_expired);
    return;
  }
  state = body;
  render();
  $("stamp").textContent = new Date().toLocaleTimeString();
  startCooldown(data.refresh_cooldown);
}

function startCooldown(seconds) {
  cooling = true;
  const button = $("refreshBtn");
  button.disabled = true;
  let left = seconds;
  const label = () => { button.textContent = left > 0
    ? `${data.messages.web_lobby_refresh} (${left})` : data.messages.web_lobby_refresh; };
  label();
  const tick = setInterval(() => {
    left -= 1;
    label();
    if (left <= 0) { clearInterval(tick); cooling = false; button.disabled = false; }
  }, 1000);
}

// ── 방 입장 ────────────────────────────────────────────────────────────────
function tryJoin(room) {
  // 비공개 방은 비밀번호를 묻는다. 초대로 들어오는 경우는 서버가 면제해준다.
  if (!room.private) return join(room.room_id, "");
  openDialog({
    title: data.messages.web_lobby_password_prompt,
    fields: `<input type="password" id="dPassword" maxlength="${data.password_max_length}">`,
    confirm: data.messages.web_lobby_join,
    onConfirm: (dialog) => {
      const password = dialog.querySelector("#dPassword").value;
      if (!password) return data.messages.web_lobby_password_needed;
      join(room.room_id, password);
      return null;
    },
  });
}

const JOIN_ERRORS = {
  banned: "web_lobby_banned", room_gone: "web_lobby_room_gone", room_full: "web_lobby_room_full",
  wrong_password: "web_lobby_password_wrong", already_in_room: "web_lobby_already_in_room",
  expired: "web_lobby_expired",
};

async function join(roomId, password) {
  const res = await fetch(`/api/lobby/join?token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room_id: roomId, password }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    toast(data.messages[JOIN_ERRORS[body.error]] || body.error || "error", "bad");
    // 이미 닫히거나 가득 찬 방이면 화면의 목록이 낡았다는 뜻이다 — 조용히 다시 받아온다
    if (body.error === "room_gone" || body.error === "room_full") refresh(true);
    return;
  }
  closeDialog();
  location.href = `/room?id=${body.room_id}&token=${encodeURIComponent(token)}`;
}

// ── 방 만들기 ──────────────────────────────────────────────────────────────
function openCreate() {
  openDialog({
    title: data.messages.web_lobby_create_title,
    fields:
      `<div class="field" style="width:100%">
         <label>${escapeHtml(data.messages.web_lobby_name_label)}</label>
         <input type="text" id="dName" maxlength="40"
                placeholder="${escapeHtml(data.messages.web_lobby_name_placeholder)}">
       </div>
       <div class="field" style="width:100%">
         <label>${escapeHtml(data.messages.web_lobby_wager_label)}</label>
         <input type="number" id="dWager" min="0" value="0">
       </div>
       <div class="field" style="width:100%">
         <label>${escapeHtml(data.messages.web_lobby_background_label)}</label>
         <select id="dBackground">
           <option value="random">${escapeHtml(data.messages.web_lobby_background_random)}</option>
           ${(data.backgrounds || []).map(bg =>
              `<option value="${escapeHtml(bg.id)}">${escapeHtml(bg.name)}</option>`).join("")}
         </select>
       </div>
       <label class="check"><input type="checkbox" id="dPrivate">
         ${escapeHtml(data.messages.web_lobby_private_label)}</label>
       <div class="field" style="width:100%" id="dPasswordRow" hidden>
         <label>${escapeHtml(data.messages.web_lobby_password_label)}</label>
         <input type="password" id="dPassword" maxlength="${data.password_max_length}">
       </div>`,
    confirm: data.messages.web_lobby_confirm,
    onReady: (dialog) => {
      const box = dialog.querySelector("#dPrivate");
      box.onchange = () => { dialog.querySelector("#dPasswordRow").hidden = !box.checked; };
    },
    onConfirm: async (dialog) => {
      const wager = parseInt(dialog.querySelector("#dWager").value, 10);
      if (!Number.isFinite(wager) || wager < 0) return data.messages.web_lobby_wager_invalid;
      if (wager > 0 && wager < data.min_wager) return data.messages.web_lobby_wager_invalid;
      const priv = dialog.querySelector("#dPrivate").checked;
      const password = priv ? dialog.querySelector("#dPassword").value : "";
      if (priv && !password) return data.messages.web_lobby_password_needed;

      const res = await fetch(`/api/lobby/create?token=${encodeURIComponent(token)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: dialog.querySelector("#dName").value, wager, password,
                               background: dialog.querySelector("#dBackground").value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        return data.messages[{ poor: "web_lobby_poor", rooms_full: "web_lobby_rooms_full",
                               already_in_room: "web_lobby_already_in_room",
                               bad_wager: "web_lobby_wager_invalid",
                               bad_background: "web_lobby_wager_invalid",
                               expired: "web_lobby_expired" }[body.error]] || body.error;
      }
      location.href = `/room?id=${body.room_id}&token=${encodeURIComponent(token)}`;
      return null;
    },
  });
}

// ── 겹쳐 뜨는 창 ───────────────────────────────────────────────────────────
let veil = null;
function closeDialog() { if (veil) { veil.remove(); veil = null; } }

function openDialog({ title, fields, confirm, onReady, onConfirm }) {
  closeDialog();
  veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML =
    `<div class="dialog">
       <h3>${escapeHtml(title)}</h3>
       ${fields}
       <div class="err"></div>
       <div class="row">
         <button class="btn" data-cancel>${escapeHtml(data.messages.web_lobby_cancel)}</button>
         <button class="btn primary" data-ok>${escapeHtml(confirm)}</button>
       </div>
     </div>`;
  const dialog = veil.querySelector(".dialog");
  const err = dialog.querySelector(".err");
  veil.querySelector("[data-cancel]").onclick = closeDialog;
  veil.querySelector("[data-ok]").onclick = async () => {
    err.textContent = "";
    const problem = await onConfirm(dialog);
    if (problem) err.textContent = problem;
  };
  veil.onclick = (e) => { if (e.target === veil) closeDialog(); };
  document.body.appendChild(veil);
  if (onReady) onReady(dialog);
  const first = dialog.querySelector("input");
  if (first) first.focus();
  dialog.addEventListener("keydown", (e) => {
    if (e.key === "Enter") veil.querySelector("[data-ok]").click();
    if (e.key === "Escape") closeDialog();
  });
}

// ── 실시간 연결 ────────────────────────────────────────────────────────────
// **방 목록은 이 연결로 오지 않는다.** 방이 생기고 사라질 때마다 접속자 전원에게 전체 목록을
// 보내면 접속자 수의 제곱으로 비용이 늘어서(실측: 200명 접속 시 방 생성 20건 = Render 0.1 CPU로
// 약 10초), 목록은 첫 입장과 새로고침 버튼으로만 받는다.
// 이 연결이 하는 일은 두 가지뿐이다 — **초대 알림**(새로고침을 눌러야 보이면 초대가 성립하지
// 않는다. 특정 한 사람에게만 가므로 접속자 수와 무관하게 싸다)과 유휴 정리 안내.
let primed = false;
function connect() {
  const source = new EventSource(
    `/api/lobby/stream?token=${encodeURIComponent(token)}&cid=${CID}`);
  // **목록은 스트림이 열린 뒤에 받아야 한다.** 서버는 이 연결을 보고 "로비에 있는 사람"을 세므로,
  // 먼저 받아오면 접속자 목록에 내가 빠진 채로 그려진다.
  source.onopen = () => {
    if (!primed) { primed = true; refresh(true); }
  };
  source.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    if (payload.kicked === "idle") {
      source.close();
      fullScreenNotice(msg("web_lobby_idle_kicked", { minutes: data.idle_minutes }));
      return;
    }
    if (payload.kicked === "elsewhere") {
      // 한 사람당 창 하나만 유지한다 — 새 창이 붙으면 이 창을 끊는다
      source.close();
      fullScreenNotice(data.messages.web_lobby_kicked_elsewhere);
      return;
    }
    if (payload.type === "invite") {
      invites.push(payload);
      renderInvites();
    }
  };
  source.onerror = () => {
    source.close();
    if (stopped) return;
    setTimeout(connect, 3000);   // 초대를 놓치지 않게 다시 붙는다
  };
}

async function boot() {
  const res = await fetch(`/api/lobby/labels?token=${encodeURIComponent(token)}`);
  if (!res.ok) {
    document.body.innerHTML = "";
    fullScreenNotice("링크가 만료되었습니다. 디스코드에서 다시 눌러주세요.");
    return;
  }
  data = await res.json();

  document.title = data.messages.web_lobby_title;
  $("title").textContent = data.messages.web_lobby_title;
  $("createBtn").textContent = data.messages.web_lobby_create;
  $("createBtn").hidden = false;
  $("createBtn").onclick = openCreate;
  $("usersLabel").textContent = data.messages.web_lobby_users;
  $("lblVisibility").textContent = data.messages.web_lobby_filter_visibility;
  $("lblWager").textContent = data.messages.web_lobby_filter_wager;
  $("lblSearch").textContent = data.messages.web_lobby_filter_search;
  $("fSearch").placeholder = data.messages.web_lobby_filter_search_hint;
  for (const [value, key] of [["all", "web_lobby_filter_all"],
                              ["public", "web_lobby_filter_public"],
                              ["private", "web_lobby_filter_private"]]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = data.messages[key];
    $("fVisibility").appendChild(option);
  }
  $("refreshBtn").textContent = data.messages.web_lobby_refresh;
  $("refreshBtn").hidden = false;
  $("refreshBtn").onclick = () => refresh(false);
  $("filters").hidden = false;
  for (const id of ["fVisibility", "fWagerMin", "fWagerMax", "fSearch"]) {
    $(id).addEventListener("input", readFilters);
  }
  connect();   // 스트림이 열리면 onopen에서 목록을 한 번 받아온다
}

boot();
</script>
