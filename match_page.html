<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle</title>
<style>
  :root {
    --bg: #11131a; --panel: #1c1f29; --line: #2e3342; --text: #e7e9ee; --dim: #8d94a5;
    --me: #4f8cff; --them: #ff5f6d; --ok: #3ddc84; --bad: #ff4d4f; --gold: #ffc53d;
    --R: #8b96a5; --Rplus: #4fa3c7; --SR: #c9a227; --SSR: #b562d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font-family: "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  [hidden] { display: none !important; }

  /* 화면 전체 흔들기 — 판정 순간의 타격감 */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-9px, 4px) rotate(-.5deg); }
    30% { transform: translate(8px, -5px) rotate(.4deg); }
    45% { transform: translate(-6px, -3px); }
    60% { transform: translate(5px, 4px); }
    80% { transform: translate(-3px, 1px); }
  }
  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }

  #app { display: grid; grid-template-columns: 1fr 220px; height: 100%; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; } .panel { display: none; } }

  /* 보드(= 패널을 뺀 화면)는 하나의 좌표계다. 손패는 아래 레일에 깔고 가운데는 비워 둔다 —
     VS와 내민 카드가 **보드 정중앙**을 기준으로 놓여야 하기 때문. */
  .board { position: relative; height: 100%; min-height: 0; padding: 10px 14px; overflow: hidden; }

  /* 손패는 마주 보는 두 줄이다.
     상대: **우측 상단 끝에 이름**, 거기서 왼쪽으로 카드.
     나:  **좌측 하단 끝에 이름**, 거기서 오른쪽으로 카드. */
  .rail { position: absolute; left: 14px; right: 14px; display: flex; gap: 10px; }
  .rail.them { top: 10px; justify-content: flex-end; align-items: flex-start; }
  .rail.me { bottom: 10px; justify-content: flex-start; align-items: flex-end; }
  .nameplate { flex: none; }

  /* ── 이름표 ─────────────────────────────── */
  .nameplate { display: flex; flex-direction: column; gap: 6px; }
  .rail.them .nameplate { align-items: flex-end; }
  /* 닉네임은 화면 구석에서도 바로 읽혀야 해서 크게 잡는다 (좁은 화면에서는 줄어든다) */
  .nameplate .who { font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; white-space: nowrap; }
  .nameplate.them .who { color: var(--them); }
  .nameplate.me .who { color: var(--me); }
  .pips { display: flex; gap: 4px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
  .pip.on { border-color: transparent; }
  .them .pip.on { background: var(--them); box-shadow: 0 0 10px var(--them); }
  .me .pip.on { background: var(--me); box-shadow: 0 0 10px var(--me); }
  @keyframes pipPop { 0% { transform: scale(0); } 60% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .pip.pop { animation: pipPop .4s ease-out; }

  /* ── 손패 ───────────────────────────────── */
  /* 양쪽 5장이 한 줄에 같이 놓이므로 카드 폭은 화면에 맞춰 줄어든다 (10장 + 이름 두 개) */
  .hand { display: flex; gap: 6px; min-width: 0; }
  .hand.them { flex-direction: row-reverse; }   /* 이름(오른쪽 끝)에서 왼쪽으로 쌓인다 */
  /* 카드 = 등급 프레임 + 일러스트 + 상단 직업/속성 아이콘 + 하단 능력치.
     좌표는 전부 512x768 프레임 대비 비율이라 카드 크기를 바꿔도 정렬이 유지된다
     (card_renderer.py의 portrait_box / job_icon_center / stat_panel에서 그대로 뽑았다).
     **프레임의 일러스트 영역은 투명이 아니라 불투명 텍스처**라 프레임을 깔고 그 위에
     일러스트를 올려야 한다 — 순서를 바꾸면 그림이 가려진다.
     등급은 프레임 색이 말해주므로 따로 배지를 달지 않는다. */
  .card { width: 140px; flex: none; position: relative; transition: transform .18s, filter .18s; }
  /* 한 줄에 5장씩이라 예전(10장 한 줄)보다 크게 잡을 수 있다. 화면 폭에 비례시켜서
     좁은 화면에서도 이름표까지 한 줄에 들어가게 한다. */
  .hand .card { width: clamp(52px, 9vw, 120px); flex: none; }
  .hand.me .card.pickable { cursor: pointer; }
  /* hover에 drop-shadow를 쓰면 알파 모양을 따라 블러를 계산하느라 매번 새 레이어가 생긴다.
     카드는 프레임 PNG라 box-shadow는 사각형으로 어긋나므로, 블러가 없는 밝기 필터로 대신한다. */
  .hand.me .card.pickable { will-change: transform; }
  .hand.me .card.pickable:hover { transform: translateY(-10px) scale(1.05);
                                   filter: brightness(1.15) saturate(1.1); }
  .card.gone { opacity: 0; transform: scale(.6); pointer-events: none; }

  .art { position: relative; width: 100%; aspect-ratio: 512 / 768; }
  .art > * { position: absolute; }
  .art .frame { inset: 0; width: 100%; height: 100%; }
  .art .portrait { left: 7.81%; top: 11.72%;
                    width: 84.18%; height: 50.65%;
                    object-fit: contain; }
  /* 두 아이콘은 원본이 똑같은 75x75라 **크기를 한 곳에서 같이 정한다** — 따로 적어두면
     한쪽만 고쳐져 직업 아이콘만 작아 보인다(실제로 12.30% vs 14.65%로 벌어져 있었다). */
  .art .icon { top: 18.36%; width: 14.65%; transform: translate(-50%, -50%); }
  .art .job { left: 84.77%; }
  .art .elem { left: 15.23%; }

  /* 이름은 프레임의 이름칸 안에. 카드가 작아도 읽히도록 글자 크기는 카드 폭에 비례시킨다. */
  .art .cname { left: 9.77%; top: 5.73%;
                 width: 80.47%; height: 4.56%;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 5.4cqw; font-weight: 700; color: #fff; overflow: hidden; line-height: 1;
                 white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .card { container-type: inline-size; }

  /* 능력치는 프레임 하단 패널 안. 아이콘 왼쪽 / 숫자 오른쪽으로 2열 3행. */
  .art .stat { display: flex; align-items: center; gap: .35em;
                transform: translateY(-50%); font-size: 8cqw; color: #fff;
                text-shadow: 0 1px 2px rgba(0,0,0,.85); font-variant-numeric: tabular-nums; }
  .art .stat img { width: 6.64cqw; height: auto; }
  .card .st-attack { left: 17.07%; top: 71.85%; }
  .card .st-hp { left: 59.16%; top: 71.85%; }
  .card .st-defense { left: 17.07%; top: 79.88%; }
  .card .st-accuracy { left: 59.16%; top: 79.88%; }
  .card .st-evasion { left: 17.07%; top: 87.91%; }

  /* ── 판정 무대 ──────────────────────────── */
  /* 덱 선택·안내 문구가 보드 가운데에 오도록 절대 배치로 깔아둔다 (레일 위에 겹친다) */
  .stage { position: absolute; inset: 0 14px 0 14px; display: flex;
           align-items: center; justify-content: center; }

  /* 판정은 보드 위에 겹쳐 띄웠다가 걷는다. 손패 줄에 끼워 넣으면 카드를 작게 만들 수밖에 없다.
     **화면 전체가 아니라 보드에만** 깔아야 VS가 패널을 뺀 화면의 정중앙에 온다. */
  .clashLayer { position: absolute; inset: 0; z-index: 30;
                background: radial-gradient(ellipse at center, rgba(4,6,10,.9), rgba(4,6,10,.98));
                animation: fadeIn .18s ease-out both; }
  /* 판정 중에는 가운데 안내 문구를 감춘다 — 안 그러면 VS 뒤에 글자가 비쳐 지저분하다.
     (클래스를 .board에 두는 이유: .stage 안쪽은 스냅샷마다 다시 그려진다) */
  .board.clashing .stage { visibility: hidden; }
  .clashLayer.out { animation: fadeOut .35s ease-in both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* 보드 정중앙에 찍은 점 하나(크기 0). 안의 모든 것은 이 점 기준으로 놓인다 —
     가운데 정렬을 flex에 맡기면 양쪽 요소 폭에 따라 VS가 밀려서 정중앙이 아니게 된다. */
  .axis { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .axis > * { position: absolute; }

  /* 내민 카드: VS 기준 내 카드는 왼쪽 위, 상대 카드는 오른쪽 아래 */
  /* 내민 카드는 VS 옆 수치와 겹치지 않을 만큼 바깥으로 빼고, 세로로는 보드 절반 안에 들어와야
     한다(카드 높이 = 폭 x 1.5 + 캡션). 고정 px로 두면 좁은 화면에서 손패 줄을 덮어버린다. */
  /* 판정 근거는 카드 **옆**에 둔다. 아래에 쌓으면 그만큼 세로를 먹어서 카드를 더 줄여야 하고,
     그래도 손패 줄을 덮었다. 세로 여유 = 보드 절반 - 손패 레일 - 여백이고 카드 높이는 폭 x 1.5다. */
  .played { display: flex; align-items: center; gap: 8px; }
  .played .card { width: min(150px, calc(23vh - 30px), 22vw); flex: none; }
  .played .reason { width: clamp(56px, 7vw, 112px); flex: none; }
  /* 카드는 VS 옆 수치 바깥에 선다: 수치 여백 + 수치 폭보다 멀리 */
  .played.me { right: clamp(96px, 12.5vw, 176px); bottom: 14px; flex-direction: row-reverse; }
  .played.them { left: clamp(96px, 12.5vw, 176px); top: 14px; }
  /* 패널이 숨는 좁은 화면에서는 근거 문구까지 넣을 자리가 없다 */
  @media (max-width: 760px) { .played .reason { display: none; } }
  @keyframes slamFromTopLeft { 0% { transform: translate(-90px,-120px) scale(.7); opacity: 0; }
                               70% { transform: translate(6px,8px) scale(1.04); opacity: 1; }
                               100% { transform: translate(0,0) scale(1); } }
  @keyframes slamFromBottomRight { 0% { transform: translate(90px,120px) scale(.7); opacity: 0; }
                                   70% { transform: translate(-6px,-8px) scale(1.04); opacity: 1; }
                                   100% { transform: translate(0,0) scale(1); } }
  .played.me .card { animation: slamFromTopLeft .36s cubic-bezier(.2,.9,.3,1.4) both; }
  .played.them .card { animation: slamFromBottomRight .36s cubic-bezier(.2,.9,.3,1.4) both .1s; }
  .played.won .card { box-shadow: 0 0 26px rgba(255,197,61,.65); }
  .played.lost .card { filter: grayscale(.85) brightness(.55); }
  .played .reason { font-size: 11px; color: var(--dim); line-height: 1.35; }
  .played.me .reason { text-align: right; }
  .played.them .reason { text-align: left; }
  .played .reason b { color: var(--text); font-weight: 600; }

  /* 어떤 수치를 가져왔는지 카드 위에서 직접 빛낸다 (동점이면 그 전부가 빛난다) */
  @keyframes statPulse { 0%,100% { box-shadow: 0 0 0 rgba(255,197,61,0); }
                         50% { box-shadow: 0 0 14px 2px rgba(255,197,61,.85); } }
  .art .stat.glow { color: var(--gold); background: rgba(255,197,61,.22);
                    border-radius: 6px; padding: 0 .3em; margin: 0 -.3em;
                    text-shadow: 0 0 8px rgba(255,197,61,.9);
                    animation: statPulse 1.2s ease-in-out infinite; }

  /* 비교 수치: 내 것은 VS 왼쪽, 상대 것은 VS 오른쪽 */
  /* 승패 글자가 VS 자리에 뜨므로 수치는 그 글자 폭("무승부"가 가장 넓다) 밖으로 물러나야 한다 */
  .tally { top: 0; transform: translateY(-50%); min-width: clamp(44px, 5.5vw, 76px); }
  .tally.me { right: clamp(46px, 5.6vw, 72px); text-align: right; }
  .tally.them { left: clamp(46px, 5.6vw, 72px); text-align: left; }
  .tally .num { display: block; position: relative; overflow: hidden;
                height: 1.08em; font-size: clamp(28px, 4.2vw, 44px); font-weight: 800; line-height: 1.08;
                font-variant-numeric: tabular-nums; }
  .tally.me .num { color: var(--me); }
  .tally.them .num { color: var(--them); }
  @keyframes valueIn { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .tally.show .num { animation: valueIn .3s cubic-bezier(.2,.9,.3,1.5) both; }
  /* 슬롯머신: 옛 숫자는 아래로 사라지고 새 숫자가 위에서 내려온다 */
  .tally .digit { position: absolute; inset: 0; display: flex; align-items: center; }
  .tally.me .digit { justify-content: flex-end; }
  .tally.them .digit { justify-content: flex-start; }
  @keyframes digitOut { to { transform: translateY(105%); opacity: 0; } }
  @keyframes digitIn { from { transform: translateY(-105%); opacity: 0; }
                       to { transform: translateY(0); opacity: 1; } }
  .tally .digit.out { animation: digitOut .17s ease-in forwards; }
  .tally .digit.in { animation: digitIn .17s ease-out both; }

  /* 속성 보너스: 내 수치가 오르면 숫자 **위**, 상대 수치가 오르면 숫자 **아래** */
  .tally .bonus { position: absolute; left: 0; right: 0; font-size: 13px; font-weight: 700;
                  color: var(--gold); white-space: nowrap; }
  .tally.me .bonus { bottom: 100%; margin-bottom: 4px; text-align: right; }
  .tally.them .bonus { top: 100%; margin-top: 4px; text-align: left; }
  @keyframes burst { 0% { transform: scale(.4); opacity: 0; }
                     60% { transform: scale(1.15); opacity: 1; }
                     100% { transform: scale(1); opacity: 1; } }
  .tally .bonus { animation: burst .4s ease-out both; }

  /* VS / 승패 문구 — 보드 정중앙 */
  .versus { left: 0; top: 0; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: 800; color: var(--dim); letter-spacing: .08em; }
  @keyframes impact { 0% { transform: scale(0); opacity: 1; }
                      100% { transform: scale(2.6); opacity: 0; } }
  .impact { position: absolute; inset: -22px; border-radius: 50%; pointer-events: none;
            border: 3px solid var(--gold); opacity: 0; }
  .impact.go { animation: impact .5s ease-out both; }
  /* 가운데 정렬(translate -50%)을 keyframe에만 두면 애니메이션이 없을 때 글자가 오른쪽으로
     밀려 수치를 덮는다. 기본 상태에도 넣어둔다. */
  .versus .verdict { position: absolute; left: 50%; top: 50%; white-space: nowrap;
                     transform: translate(-50%, -50%);
                     font-size: clamp(22px, 2.6vw, 34px); font-weight: 900; letter-spacing: .06em;
                     opacity: 0; }
  .versus .vs-text { transition: opacity .2s; }
  .versus.decided .vs-text { opacity: 0; }
  .verdict.win { color: var(--ok); text-shadow: 0 0 26px rgba(61,220,132,.7); }
  .verdict.lose { color: var(--bad); text-shadow: 0 0 26px rgba(255,77,79,.7); }
  .verdict.draw { color: var(--dim); }
  @keyframes verdictIn { 0% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; }
                         55% { transform: translate(-50%,-50%) scale(.9); opacity: 1; }
                         100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  .versus.decided .verdict { animation: verdictIn .4s cubic-bezier(.2,.9,.3,1.5) both; }

  .hint { color: var(--dim); font-size: 14px; text-align: center; }

  /* 덱 선택 — 대전 시작 전에 3개 덱 중 하나를 고른다 (예전엔 디스코드 선택 메뉴였다) */
  .deckpick { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .deckpick h3 { margin: 0; font-size: 15px; color: var(--dim); font-weight: 600; }
  .deckrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .deckopt { border: 2px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer;
             background: var(--panel); transition: border-color .15s, transform .15s; }
  .deckopt:hover { border-color: var(--me); transform: translateY(-3px); }
  .deckopt.picked { border-color: var(--me); box-shadow: 0 0 0 2px rgba(79,140,255,.35); }
  .deckopt .dlabel { font-size: 13px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .deckopt .dcards { display: flex; gap: 4px; }
  .deckopt .dcards .card { width: 62px; }

  /* 최종 결과의 포인트 증감 */

  /* ── 최종 결과 ──────────────────────────── */
  /* 완전히 덮지 않고 80% 검정으로만 가린다 — 마지막 판의 카드가 비쳐 보이게 하려는 것.
     결과 자체는 우측 관전 UI에서 보여준다. */
  .finalDim { position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, .8);
              animation: fadeIn .4s ease-out both; pointer-events: none; }

  .result { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 2px;
            display: flex; flex-direction: column; gap: 6px; }
  .result .big { font-size: 30px; font-weight: 900; letter-spacing: .1em; line-height: 1.1; }
  .result.win .big { color: var(--gold); text-shadow: 0 0 22px rgba(255,197,61,.7); }
  .result.lose .big { color: var(--bad); text-shadow: 0 0 22px rgba(255,77,79,.55); }
  .result.draw .big { color: var(--dim); }
  @keyframes resultIn { 0% { transform: scale(2.2); opacity: 0; }
                        60% { transform: scale(.94); opacity: 1; }
                        100% { transform: scale(1); } }
  .result .big { animation: resultIn .55s cubic-bezier(.2,.9,.3,1.4) both; }
  .result .line { font-size: 13px; color: var(--dim); }
  .result .delta { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .result .delta.up { color: var(--ok); } .result .delta.down { color: var(--bad); }
  .result .delta.flat { color: var(--dim); }

  /* 좁은 화면에서는 우측 패널이 숨겨져 있어 결과가 안 보인다 — 끝나면 다시 펼친다 */
  @media (max-width: 760px) {
    #app.ended { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #app.ended .panel { display: flex; border-left: none; border-top: 1px solid var(--line); }
  }

  /* ── 우측 패널 ──────────────────────────── */
  .panel { background: var(--panel); border-left: 1px solid var(--line); padding: 14px;
           display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .panel h2 { margin: 0; font-size: 13px; color: var(--dim); font-weight: 600; }
  .score { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .roundline { font-size: 13px; color: var(--dim); }
  .spec { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--bad); }
  .timer { font-size: 13px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .wager { font-size: 13px; color: var(--gold); }
  .status { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div class="board" id="board">
    <div class="stage" id="stage"><div class="hint" id="hint"></div></div>
    <div class="rail them">
      <div class="hand them" id="themHand"></div>
      <div class="nameplate them"><span class="who" id="themName">—</span><span class="pips" id="themPips"></span></div>
    </div>
    <div class="rail me">
      <div class="nameplate me"><span class="who" id="myName">—</span><span class="pips" id="myPips"></span></div>
      <div class="hand me" id="myHand"></div>
    </div>
  </div>
  <aside class="panel">
    <div>
      <h2 id="roundLabel">—</h2>
      <div class="score" id="score">0 : 0</div>
    </div>
    <div class="wager" id="wager" hidden></div>
    <div class="timer" id="timer" hidden></div>
    <div>
      <h2>관전</h2>
      <div class="spec"><span class="dot" id="dot"></span><span id="specCount">—</span></div>
    </div>
    <div class="status" id="status"></div>
  </aside>
</div>

<script>
const params = new URLSearchParams(location.search);
const matchId = params.get("id");
const token = params.get("token") || "";
const $ = (id) => document.getElementById(id);
// 에셋 확장자는 서버 설정을 따른다 (PNG -> WebP 전환을 설정 한 줄로 되돌릴 수 있게)
let EXT = ".webp";

let labels = null;
let state = null;
let shownRound = 0;      // 이펙트를 이미 재생한 라운드 번호 (같은 스냅샷이 또 와도 두 번 안 튼다)
let timerEnd = 0;
// 판정 연출 단계(ms). 카드가 꽂히고 -> 쓰인 수치가 빛나고 -> 숫자가 뜨고 ->
// 속성 보너스가 붙고 -> 슬롯머신으로 더해지고 -> 승패가 뜬다.
// 합계는 오락실.json의 pvp_config.round_reveal_pause_seconds보다 길면 안 된다 —
// 길면 다음 라운드가 연출 위에서 시작돼 카드 고를 시간을 까먹는다.
const STEP = { glow: 480, value: 880, bonus: 1240, roll: 1620, rollStep: 190, after: 420, hold: 1200 };
let clashTimers = [];
function at(ms, fn) { clashTimers.push(setTimeout(fn, ms)); }
function clearClashTimers() { clashTimers.forEach(clearTimeout); clashTimers = []; }

const msg = (key, vars = {}) =>
  (labels.messages[key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text ?? "";
  return d.innerHTML;
}

// 카드 한 장 = 프레임 + 일러스트 + 직업/속성 아이콘 + 능력치.
// 서버 렌더러가 그리던 것과 같은 구성이지만 브라우저가 그리므로 서버 CPU는 0이다.
function cardHtml(card, extraClass = "", glow = []) {
  if (!card) return `<div class="card ${extraClass}"><div class="art"></div></div>`;
  const base = labels.image_base_url;
  // glow에 담긴 스탯은 나중에 .glow가 붙어 빛난다 (판정에 쓰인 수치. 동점이면 여러 개)
  const stats = labels.stat_order.map(key => `
    <span class="stat st-${key}${glow.includes(key) ? " lit" : ""}" title="${esc(labels.stat_labels[key])}">
      <img src="${base}stat_icon/${key}${EXT}" alt="">${card.stats[key]}
    </span>`).join("");
  return `<div class="card ${extraClass}" data-hero="${card.hero_id}">
    <div class="art">
      <img class="frame" src="${base}card/${encodeURIComponent(card.grade)}${EXT}" alt="">
      <img class="portrait" src="${base}hero/${encodeURIComponent(card.image_name)}${EXT}" alt="">
      <img class="icon job" src="${base}job_icon/${card.job}${EXT}" alt="" title="${esc(labels.job_labels[card.job])}">
      ${card.element ? `<img class="icon elem" src="${base}element/${card.element}${EXT}" alt="" title="${esc(labels.element_labels[card.element])}">` : ""}
      <div class="cname">${esc(card.name)}</div>
      ${stats}
    </div>
  </div>`;
}

function renderPips(el, wins, total) {
  const before = el.querySelectorAll(".pip.on").length;
  el.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const pip = document.createElement("span");
    pip.className = "pip" + (i < wins ? " on" : "") + (i === wins - 1 && wins > before ? " pop" : "");
    el.appendChild(pip);
  }
}

function render() {
  const s = state;
  $("themName").textContent = s.them.name;
  $("myName").textContent = s.me.name;
  renderPips($("themPips"), s.them.wins, s.deck_size);
  renderPips($("myPips"), s.me.wins, s.deck_size);
  $("score").textContent = msg("web_match_score", { you: s.me.wins, them: s.them.wins });
  $("roundLabel").textContent = s.round
    ? msg("web_match_round", { round: s.round, total: s.deck_size })
    : msg("match_waiting_deck");
  $("specCount").textContent = msg("web_match_spectators", { count: s.spectators });
  if (s.wager) { $("wager").hidden = false; $("wager").textContent = msg("web_match_wager", { wager: s.wager.toLocaleString() }); }

  // 손패: 이미 낸 카드는 빠지고 남은 카드만 정렬된다 (서버가 remaining에서 제거해준다)
  $("themHand").innerHTML = s.them.remaining.map(c => cardHtml(c)).join("")
    || (s.phase === "deck" ? "" : `<div class="hint">${msg("match_waiting_deck")}</div>`);

  const canPick = s.my_turn && !s.finished;
  $("myHand").innerHTML = s.me.remaining
    .map(c => cardHtml(c, canPick ? "pickable" : "")).join("");
  if (canPick) {
    for (const el of $("myHand").querySelectorAll(".card")) {
      el.onclick = () => pick(Number(el.dataset.hero), el);
    }
  }

  // 가운데 행: 덱을 아직 안 골랐으면 덱 선택, 아니면 안내 문구.
  // 판정 연출은 그 위에 겹쳐 띄웠다가 걷는다.
  if (!s.finished && s.my_decks) {
    renderDeckPick(s);
  } else {
    $("stage").innerHTML = `<div class="hint">${
      s.finished ? msg("web_match_ended")
      : s.phase === "deck" ? msg("match_waiting_deck")
      : s.my_turn ? msg("web_match_pick_prompt") : msg("match_waiting_pick")}</div>`;
  }
  if (s.last_round && s.last_round.round !== shownRound) {
    showClash(s.last_round);
    shownRound = s.last_round.round;
  }

  if (s.finished) showFinal(s);
  startTimer(s);
}

function renderDeckPick(s) {
  const numbers = Object.keys(s.my_decks).sort();
  $("stage").innerHTML = `
    <div class="deckpick">
      <h3>${msg("web_match_deck_prompt")}</h3>
      <div class="deckrow">
        ${numbers.map(n => `
          <div class="deckopt" data-deck="${n}">
            <div class="dlabel">${msg("web_match_deck_label", { number: n })}</div>
            <div class="dcards">${s.my_decks[n].map(c => cardHtml(c)).join("")}</div>
          </div>`).join("")}
      </div>
    </div>`;
  for (const el of $("stage").querySelectorAll(".deckopt")) {
    el.onclick = () => chooseDeck(Number(el.dataset.deck), el);
  }
}

async function chooseDeck(number, el) {
  el.classList.add("picked");
  const res = await fetch(`/api/match/deck?id=${matchId}&token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ deck_number: number }),
  });
  if (!res.ok) el.classList.remove("picked");   // 이미 골랐거나 시간이 지난 경우 되돌린다
}

function showClash(round) {
  // last_round는 도전자/상대 축으로 오므로, 내 쪽이 어느 축인지 state로 판별한다
  const mine = round.mine, theirs = round.theirs;
  const verdict = round.draw ? "draw" : mine.won ? "win" : "lose";
  const verdictText = msg(round.draw ? "web_match_draw" : mine.won ? "web_match_win" : "web_match_lose");

  const played = (d, who) => `
    <div class="played ${who} ${d.won ? "won" : round.draw ? "" : "lost"}">
      ${cardHtml(d.card, "", d.stats || [d.stat])}
      ${reasonHtml(d)}
    </div>`;
  // 수치는 아직 기본값만 보여준다 — 속성 보너스는 뒤에서 슬롯머신으로 더해진다
  const tally = (d, who) => `
    <div class="tally ${who}" hidden>
      <span class="num"><span class="digit">${d.base}</span></span>
      ${d.element_bonus ? `<div class="bonus" hidden>${
        esc(msg("web_match_element_bonus", { bonus: d.element_bonus }))}</div>` : ""}
    </div>`;

  clearClashTimers();
  document.querySelector(".clashLayer")?.remove();
  const layer = document.createElement("div");
  layer.className = "clashLayer";
  layer.innerHTML = `
    <div class="axis">
      ${played(mine, "me")}
      ${played(theirs, "them")}
      ${tally(mine, "me")}
      <div class="versus">
        <span class="vs-text">VS</span>
        <span class="impact"></span>
        <span class="verdict ${verdict}">${verdictText}</span>
      </div>
      ${tally(theirs, "them")}
    </div>`;
  $("board").appendChild(layer);
  $("board").classList.add("clashing");

  const gap = Math.max(mine.value - mine.base, theirs.value - theirs.base);
  const rollEnd = gap > 0 ? STEP.roll + gap * STEP.rollStep : STEP.value;
  const decidedAt = rollEnd + STEP.after;

  // ① 어떤 수치를 가져왔는지 카드 위에서 빛낸다 (사제전처럼 최저값이 여럿이면 전부)
  at(STEP.glow, () => layer.querySelectorAll(".stat.lit").forEach(el => el.classList.add("glow")));
  // ② 비교 수치를 VS 양옆에 띄운다 (내 것 왼쪽 / 상대 것 오른쪽)
  at(STEP.value, () => layer.querySelectorAll(".tally").forEach(el => {
    el.hidden = false;
    el.classList.add("show");
  }));
  // ③ 왜 오르는지 먼저 보여주고 ④ 그만큼 슬롯머신으로 올린다
  at(STEP.bonus, () => layer.querySelectorAll(".bonus").forEach(el => { el.hidden = false; }));
  for (const [d, who] of [[mine, "me"], [theirs, "them"]]) {
    if (d.value === d.base) continue;
    rollNumber(layer.querySelector(`.tally.${who} .num`), d.base, d.value, STEP.roll);
  }
  // ⑤ 승패
  at(decidedAt, () => {
    layer.querySelector(".versus")?.classList.add("decided");
    layer.querySelector(".impact")?.classList.add("go");
    document.body.classList.remove("shake");
    void document.body.offsetWidth;            // 애니메이션 재시작을 위한 리플로우
    document.body.classList.add("shake");
  });

  // 걷어내고 손패를 다시 쓸 수 있게 한다 (매치가 끝났으면 최종 화면이 덮는다)
  at(decidedAt + STEP.hold, () => {
    layer.classList.add("out");
    at(340, () => { layer.remove(); $("board").classList.remove("clashing"); });
  });
}

// 슬롯머신: 옛 숫자가 아래로 사라지고 다음 숫자가 위에서 내려온다 (5 -> 6 -> 7 ...)
function rollNumber(el, from, to, startAt) {
  if (!el) return;
  for (let v = from + 1; v <= to; v++) {
    at(startAt + (v - from - 1) * STEP.rollStep, () => {
      // **내보낼 숫자는 지금 맨 뒤(=직전에 들어온 것)다.** querySelector로 첫 번째를 집으면
      // 다음 칸이 190ms마다 들어오는 동안 같은 숫자를 두 번 빼려 하고, 중간 숫자들이
      // 지워지지 않은 채 쌓여 "789"처럼 보인다 (실제로 그랬다).
      const prev = el.lastElementChild;
      const next = document.createElement("span");
      next.className = "digit in";
      next.textContent = v;
      el.appendChild(next);
      if (prev) {
        prev.classList.add("out");
        at(200, () => prev.remove());
      }
    });
  }
}

function reasonHtml(detail) {
  // 어떤 스탯을 왜 썼는지 + 속성으로 얼마가 붙었는지
  const statName = labels.stat_labels[detail.stat] || detail.stat;
  const ruleKey = {
    OWN_LOWEST: "pvp_reason_own_lowest",
    BOTH_HIGHEST: "pvp_reason_both_highest",
    MATCH_OPP_LOWEST: "pvp_reason_match_opp_lowest",
  }[detail.rule] || "pvp_reason_direct";
  // 속성 보너스는 VS 옆 수치에 붙으므로 여기서는 "어떤 스탯을 왜 골랐는지"만 적는다
  const why = detail.element_bonus ? `<br>${esc(msg(detail.element_reason))}` : "";
  return `<div class="reason"><b>${esc(statName)} ${detail.base}</b><br>${esc(msg(ruleKey))}${why}</div>`;
}

function showFinal(s) {
  if (document.querySelector(".finalDim")) return;
  clearClashTimers();
  document.querySelector(".clashLayer")?.remove();
  $("board").classList.remove("clashing");

  // 보드는 80% 검정으로만 가린다 (마지막 카드가 비쳐 보이도록)
  const dim = document.createElement("div");
  dim.className = "finalDim";
  document.querySelector(".board").appendChild(dim);
  $("app").classList.add("ended");   // 좁은 화면에서도 우측 UI가 보이게

  const kind = s.winner === "me" ? "win" : s.winner === "them" ? "lose" : "draw";
  const d = s.points_delta || 0;
  const box = document.createElement("div");
  box.className = "result " + kind;
  box.innerHTML =
    `<div class="big">${msg("web_match_final_" + kind)}</div>` +
    `<div class="line">${msg("web_match_score", { you: s.me.wins, them: s.them.wins })}</div>` +
    (s.wager
      ? `<div class="delta ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : ""}${d.toLocaleString()}P</div>`
      : "") +
    (s.end_reason ? `<div class="line">${msg(s.end_reason)}</div>` : "");
  // 패널 맨 아래는 .status가 margin-top:auto로 밀어내서 결과가 화면 끝에 붙는다.
  // 가장 먼저 보여야 할 정보이므로 패널 맨 위에 넣는다.
  document.querySelector(".panel").prepend(box);
}

function startTimer(s) {
  // 마감시각은 서버가 정해서 내려준다 — 클라이언트가 따로 재면 새로고침이나 재접속 때 어긋난다
  if (s.finished || !s.deadline) { $("timer").hidden = true; timerEnd = 0; return; }
  $("timer").hidden = false;
  timerEnd = s.deadline * 1000;
}
setInterval(() => {
  if ($("timer").hidden) { timerEnd = 0; return; }
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  $("timer").textContent = `${left}s`;
}, 200);

async function pick(heroId, el) {
  el.classList.add("gone");
  timerEnd = 0;
  const res = await fetch(`/api/match/pick?id=${matchId}&token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hero_id: heroId }),
  });
  if (!res.ok) el.classList.remove("gone");   // 거절되면 되돌린다 (이미 냈거나 시간이 지난 경우)
}

// 이 매치에서 쓰일 이미지를 미리 받아둔다.
// 손패 카드에 lazy가 걸려 있으면 화면 밖 카드는 안 받아두는데, 그 카드가 판정에 나오는 순간
// 다운로드가 시작돼 연출 도중에 그림이 늦게 뜬다. 카드는 손패에서 빠지기만 하고 새로 들어오지
// 않으므로, 첫 스냅샷에 나온 것만 받아두면 매치 끝까지 충분하다.
const preloaded = new Set();
function preload(snapshot) {
  const base = labels.image_base_url;
  const urls = [];
  for (const c of [...snapshot.me.remaining, ...snapshot.them.remaining]) {
    urls.push(`${base}card/${encodeURIComponent(c.grade)}${EXT}`,
              `${base}hero/${encodeURIComponent(c.image_name)}${EXT}`,
              `${base}job_icon/${c.job}${EXT}`);
    if (c.element) urls.push(`${base}element/${c.element}${EXT}`);
  }
  for (const key of labels.stat_order) urls.push(`${base}stat_icon/${key}${EXT}`);
  for (const url of urls) {
    if (preloaded.has(url)) continue;
    preloaded.add(url);
    const img = new Image();
    img.src = url;
  }
}

function apply(snapshot) {
  // 서버의 last_round는 도전자/상대 축이고 화면은 나/상대 축이라 여기서 한 번만 바꿔둔다.
  // 관전자는 도전자를 '나'로 본다(서버가 is_challenger=true로 내려준다).
  const r = snapshot.last_round;
  if (r) {
    r.mine = snapshot.is_challenger ? r.challenger : r.opponent;
    r.theirs = snapshot.is_challenger ? r.opponent : r.challenger;
  }
  state = snapshot;
  preload(snapshot);
  render();
}

// ── 연결: SSE 우선, 막히면 폴링으로 내려간다 ──────────────────
let polling = null;
function setLive(ok) {
  $("dot").className = "dot" + (ok ? "" : " off");
  $("status").textContent = ok ? "" : msg("web_match_lost_connection");
}

function startPolling() {
  if (polling) return;
  setLive(false);
  polling = setInterval(async () => {
    const res = await fetch(`/api/match?id=${matchId}&token=${encodeURIComponent(token)}`);
    if (res.ok) { apply(await res.json()); setLive(true); }
  }, 2000);
}

function connect() {
  const source = new EventSource(`/api/match/stream?id=${matchId}&token=${encodeURIComponent(token)}`);
  let got = false;
  source.onmessage = (e) => { got = true; setLive(true); apply(JSON.parse(e.data)); };
  source.onerror = () => {
    // 첫 이벤트조차 못 받았으면 프록시가 스트림을 막고 있을 가능성이 크다 → 폴링으로 전환
    if (!got) { source.close(); startPolling(); } else { setLive(false); }
  };
}

(async function boot() {
  const res = await fetch(`/api/match/labels?id=${matchId}`);
  if (!res.ok) {
    document.body.innerHTML = `<div class="hint" style="padding:40px">Match not found. It may have already ended.</div>`;
    return;
  }
  labels = await res.json();
  EXT = labels.image_ext || EXT;
  $("hint").textContent = msg("match_waiting_deck");
  connect();
})();
</script>
</body>
</html>
