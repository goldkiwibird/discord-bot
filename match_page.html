<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle</title>
<style>
  :root {
    --bg: #11131a; --panel: #1c1f29; --line: #2e3342; --text: #e7e9ee; --dim: #8d94a5;
    --me: #4f8cff; --them: #ff5f6d; --ok: #3ddc84; --bad: #ff4d4f; --gold: #ffc53d;
    --R: #8b96a5; --Rplus: #4fa3c7; --SR: #c9a227; --SSR: #b562d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font-family: "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  [hidden] { display: none !important; }

  /* 화면 전체 흔들기 — 판정 순간의 타격감 */
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-9px, 4px) rotate(-.5deg); }
    30% { transform: translate(8px, -5px) rotate(.4deg); }
    45% { transform: translate(-6px, -3px); }
    60% { transform: translate(5px, 4px); }
    80% { transform: translate(-3px, 1px); }
  }
  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }

  #app { display: grid; grid-template-columns: 1fr 220px; height: 100%; }

  /* 모바일 전용 상단 바 / 시트 배경. PC에서는 둘 다 안 보인다.
     실제 모바일 규칙은 **스타일시트 맨 끝**에 모아뒀다 (이유는 그쪽 주석 참고). */
  .topbar { display: none; align-items: center; gap: 10px; padding: 8px 12px;
            background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar .barinfo { flex: 1; min-width: 0; }
  .menubtn { flex: none; width: 44px; height: 44px; border-radius: 10px; font-size: 19px;
             background: var(--bg); border: 1px solid var(--line); color: var(--text);
             font-family: inherit; cursor: pointer; }
  .sheetveil { display: none; position: fixed; inset: 0; z-index: 55;
               background: rgba(8,9,13,.55); }

  /* 보드(= 패널을 뺀 화면)는 하나의 좌표계다. 손패는 아래 레일에 깔고 가운데는 비워 둔다 —
     VS와 내민 카드가 **보드 정중앙**을 기준으로 놓여야 하기 때문. */
  .board { position: relative; height: 100%; min-height: 0; padding: 10px 14px; overflow: hidden; }

  /* 방 배경 영상. **보드의 첫 자식**으로 두는 것이 전부다 — .board의 다른 자식은 전부
     position:absolute라, 위치가 지정된 형제끼리는 DOM 순서로 그려져 자동으로 위에 온다.
     z-index를 주거나, 보드의 나머지 자식을 한꺼번에 집어 position을 다시 지정하는
     규칙을 넣으면 안 된다: 그런 선택자는 특이도가 .rail보다 높아 position:absolute를
     덮어써 **손패가 위아래 끝에서 떨어진다.**(실제로 목업에서 그렇게 됐다)
     투명도는 영상마다 다르므로 여기서 정하지 않고 스냅샷 값을 그대로 쓴다 —
     배경 밝기가 2배까지 차이 나서 하나로 고정하면 글자 가독성이 배경마다 달라진다. */
  .bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
           pointer-events: none; opacity: 0; transition: opacity .4s ease; }

  /* 손패는 마주 보는 두 칸이고, **이름과 카드를 위아래로 쌓는다.**
     상대: 우측 상단에 이름 → **그 바로 아래**에 카드.
     나:  좌측 하단에 이름 → **그 바로 위**에 카드.
     예전에는 이름과 카드를 한 줄에 나란히 뒀는데, 그러면 **닉네임이 길어질수록 카드가
     안쪽으로 밀렸다**(긴 이름 하나에 카드 다섯 장이 통째로 움직인다). 위아래로 나누면
     이름이 아무리 길어도 카드 자리는 그대로다. */
  .rail { position: absolute; left: 14px; right: 14px; display: flex;
          flex-direction: column; gap: 6px; }
  .rail.them { top: 10px; align-items: flex-end; }
  .rail.me { bottom: 10px; align-items: flex-start; }
  .nameplate { flex: none; max-width: 100%; }

  /* ── 이름표 ───────────────────────────────
     **점수는 가운데 점수판이 말해주므로 여기에는 이름만 둔다.** 예전에는 동그라미(.pip)로
     딴 판 수를 같이 보여줬는데, 같은 정보를 두 군데서 다르게 표현하면 눈만 분산된다. */
  .nameplate .who { font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; display: block; max-width: 100%; }
  .nameplate.them .who { color: var(--them); }
  .nameplate.me .who { color: var(--me); }

  /* ── 손패 ───────────────────────────────── */
  /* 양쪽 5장이 한 줄에 같이 놓이므로 카드 폭은 화면에 맞춰 줄어든다 (10장 + 이름 두 개) */
  .hand { display: flex; gap: 6px; min-width: 0; }
  .hand.them { flex-direction: row-reverse; }   /* 이름(오른쪽 끝)에서 왼쪽으로 쌓인다 */
  /* 카드 = 등급 프레임 + 일러스트 + 상단 직업/속성 아이콘 + 하단 능력치.
     좌표는 전부 512x768 프레임 대비 비율이라 카드 크기를 바꿔도 정렬이 유지된다
     (card_renderer.py의 portrait_box / job_icon_center / stat_panel에서 그대로 뽑았다).
     **프레임의 일러스트 영역은 투명이 아니라 불투명 텍스처**라 프레임을 깔고 그 위에
     일러스트를 올려야 한다 — 순서를 바꾸면 그림이 가려진다.
     등급은 프레임 색이 말해주므로 따로 배지를 달지 않는다. */
  .card { width: 140px; flex: none; position: relative; transition: transform .18s, filter .18s; }
  /* 한 줄에 5장씩이라 예전(10장 한 줄)보다 크게 잡을 수 있다. 화면 폭에 비례시켜서
     좁은 화면에서도 이름표까지 한 줄에 들어가게 한다. */
  /* 한 줄에 **자기 5장만** 놓이므로 예전(10장 + 이름 두 개)보다 넉넉하게 잡을 수 있다 */
  .hand .card { width: clamp(64px, 11vw, 140px); flex: none; }
  .hand.me .card.pickable { cursor: pointer; }
  /* hover에 drop-shadow를 쓰면 알파 모양을 따라 블러를 계산하느라 매번 새 레이어가 생긴다.
     카드는 프레임 PNG라 box-shadow는 사각형으로 어긋나므로, 블러가 없는 밝기 필터로 대신한다. */
  .hand.me .card.pickable { will-change: transform; }
  .hand.me .card.pickable:active { transform: translateY(-10px) scale(1.05); }
  .hand.me .card.pickable:hover { transform: translateY(-10px) scale(1.05);
                                   filter: brightness(1.15) saturate(1.1); }
  .card.gone { opacity: 0; transform: scale(.6); pointer-events: none; }

  .art { position: relative; width: 100%; aspect-ratio: 512 / 768; }
  .art > * { position: absolute; }
  .art .frame { inset: 0; width: 100%; height: 100%; }
  .art .portrait { left: 7.81%; top: 11.72%;
                    width: 84.18%; height: 50.65%;
                    object-fit: contain; }
  /* 두 아이콘은 원본이 똑같은 75x75라 **크기를 한 곳에서 같이 정한다** — 따로 적어두면
     한쪽만 고쳐져 직업 아이콘만 작아 보인다(실제로 12.30% vs 14.65%로 벌어져 있었다). */
  .art .icon { top: 18.36%; width: 14.65%; transform: translate(-50%, -50%); }
  .art .job { left: 84.77%; }
  .art .elem { left: 15.23%; }

  /* 이름은 프레임의 이름칸 안에. 카드가 작아도 읽히도록 글자 크기는 카드 폭에 비례시킨다. */
  .art .cname { left: 9.77%; top: 5.73%;
                 width: 80.47%; height: 4.56%;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 5.4cqw; font-weight: 700; color: #fff; overflow: hidden; line-height: 1;
                 white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .card { container-type: inline-size; }

  /* 능력치는 프레임 하단 패널 안. 아이콘 왼쪽 / 숫자 오른쪽으로 2열 3행. */
  .art .stat { display: flex; align-items: center; gap: .35em;
                transform: translateY(-50%); font-size: 8cqw; color: #fff;
                text-shadow: 0 1px 2px rgba(0,0,0,.85); font-variant-numeric: tabular-nums; }
  .art .stat img { width: 6.64cqw; height: auto; }
  .card .st-attack { left: 17.07%; top: 71.85%; }
  .card .st-hp { left: 59.16%; top: 71.85%; }
  .card .st-defense { left: 17.07%; top: 79.88%; }
  .card .st-accuracy { left: 59.16%; top: 79.88%; }
  .card .st-evasion { left: 17.07%; top: 87.91%; }

  /* ── 판정 무대 ──────────────────────────── */
  /* 덱 선택·안내 문구가 보드 가운데에 오도록 절대 배치로 깔아둔다 (레일 위에 겹친다) */
  .stage { position: absolute; inset: 0 14px 0 14px; display: flex;
           align-items: center; justify-content: center; }
  .stage.stacked { flex-direction: column; gap: 14px; }

  /* 판정은 보드 위에 겹쳐 띄웠다가 걷는다. 손패 줄에 끼워 넣으면 카드를 작게 만들 수밖에 없다.
     **화면 전체가 아니라 보드에만** 깔아야 VS가 패널을 뺀 화면의 정중앙에 온다. */
  /* **배경을 어둡게 덮지 않는다.** 예전에는 거의 불투명한 검정을 깔아서, 카드를 서로 내는
     순간 골라둔 배경 영상이 통째로 사라졌다. 대신 안쪽 글자에 그림자를 줘서 밝은 배경에서도
     읽히게 한다 (자기 그림자를 따로 가진 글자 — 승패, 빛나는 수치 — 는 그대로 쓴다). */
  .clashLayer { position: absolute; inset: 0; z-index: 30;
                text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.7);
                animation: fadeIn .18s ease-out both; }
  /* 판정 중에는 가운데 안내 문구를 감춘다 — 안 그러면 VS 뒤에 글자가 비쳐 지저분하다.
     (클래스를 .board에 두는 이유: .stage 안쪽은 스냅샷마다 다시 그려진다) */
  .board.clashing .stage { visibility: hidden; }
  .clashLayer.out { animation: fadeOut .35s ease-in both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* 보드 정중앙에 찍은 점 하나(크기 0). 안의 모든 것은 이 점 기준으로 놓인다 —
     가운데 정렬을 flex에 맡기면 양쪽 요소 폭에 따라 VS가 밀려서 정중앙이 아니게 된다. */
  .axis { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .axis > * { position: absolute; }

  /* 내민 카드: VS 기준 내 카드는 왼쪽 위, 상대 카드는 오른쪽 아래 */
  /* 내민 카드는 VS 옆 수치와 겹치지 않을 만큼 바깥으로 빼고, 세로로는 보드 절반 안에 들어와야
     한다(카드 높이 = 폭 x 1.5 + 캡션). 고정 px로 두면 좁은 화면에서 손패 줄을 덮어버린다. */
  /* 판정 근거는 카드 **옆**에 둔다. 아래에 쌓으면 그만큼 세로를 먹어서 카드를 더 줄여야 하고,
     그래도 손패 줄을 덮었다. 세로 여유 = 보드 절반 - 손패 레일 - 여백이고 카드 높이는 폭 x 1.5다. */
  .played { display: flex; align-items: center; gap: 8px; }
  .played .card { width: min(150px, calc(23vh - 30px), 22vw); flex: none; }
  .played .reason { width: clamp(56px, 7vw, 112px); flex: none; }
  /* 카드는 VS 옆 수치 바깥에 선다: 수치 여백 + 수치 폭보다 멀리 */
  .played.me { right: clamp(96px, 12.5vw, 176px); bottom: 14px; flex-direction: row-reverse; }
  .played.them { left: clamp(96px, 12.5vw, 176px); top: 14px; }
  /* 패널이 숨는 좁은 화면에서는 근거 문구까지 넣을 자리가 없다 */
  @media (max-width: 760px) { .played .reason { display: none; } }
  @keyframes slamFromTopLeft { 0% { transform: translate(-90px,-120px) scale(.7); opacity: 0; }
                               70% { transform: translate(6px,8px) scale(1.04); opacity: 1; }
                               100% { transform: translate(0,0) scale(1); } }
  @keyframes slamFromBottomRight { 0% { transform: translate(90px,120px) scale(.7); opacity: 0; }
                                   70% { transform: translate(-6px,-8px) scale(1.04); opacity: 1; }
                                   100% { transform: translate(0,0) scale(1); } }
  .played.me .card { animation: slamFromTopLeft .36s cubic-bezier(.2,.9,.3,1.4) both; }
  .played.them .card { animation: slamFromBottomRight .36s cubic-bezier(.2,.9,.3,1.4) both .1s; }
  .played.won .card { box-shadow: 0 0 26px rgba(255,197,61,.65); }
  .played.lost .card { filter: grayscale(.85) brightness(.55); }
  .played .reason { font-size: 11px; color: var(--dim); line-height: 1.35; }
  .played.me .reason { text-align: right; }
  .played.them .reason { text-align: left; }
  .played .reason b { color: var(--text); font-weight: 600; }

  /* 어떤 수치를 가져왔는지 카드 위에서 직접 빛낸다 (동점이면 그 전부가 빛난다) */
  @keyframes statPulse { 0%,100% { box-shadow: 0 0 0 rgba(255,197,61,0); }
                         50% { box-shadow: 0 0 14px 2px rgba(255,197,61,.85); } }
  .art .stat.glow { color: var(--gold); background: rgba(255,197,61,.22);
                    border-radius: 6px; padding: 0 .3em; margin: 0 -.3em;
                    text-shadow: 0 0 8px rgba(255,197,61,.9);
                    animation: statPulse 1.2s ease-in-out infinite; }

  /* 비교 수치: 내 것은 VS 왼쪽, 상대 것은 VS 오른쪽 */
  /* 승패 글자가 VS 자리에 뜨므로 수치는 그 글자 폭("무승부"가 가장 넓다) 밖으로 물러나야 한다 */
  .tally { top: 0; transform: translateY(-50%); min-width: clamp(44px, 5.5vw, 76px); }
  .tally.me { right: clamp(46px, 5.6vw, 72px); text-align: right; }
  .tally.them { left: clamp(46px, 5.6vw, 72px); text-align: left; }
  .tally .num { display: block; position: relative; overflow: hidden;
                height: 1.08em; font-size: clamp(28px, 4.2vw, 44px); font-weight: 800; line-height: 1.08;
                font-variant-numeric: tabular-nums; }
  .tally.me .num { color: var(--me); }
  .tally.them .num { color: var(--them); }
  @keyframes valueIn { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .tally.show .num { animation: valueIn .3s cubic-bezier(.2,.9,.3,1.5) both; }
  /* 슬롯머신: 옛 숫자는 아래로 사라지고 새 숫자가 위에서 내려온다 */
  .tally .digit { position: absolute; inset: 0; display: flex; align-items: center; }
  .tally.me .digit { justify-content: flex-end; }
  .tally.them .digit { justify-content: flex-start; }
  @keyframes digitOut { to { transform: translateY(105%); opacity: 0; } }
  @keyframes digitIn { from { transform: translateY(-105%); opacity: 0; }
                       to { transform: translateY(0); opacity: 1; } }
  .tally .digit.out { animation: digitOut .17s ease-in forwards; }
  .tally .digit.in { animation: digitIn .17s ease-out both; }

  /* 속성 보너스: 내 수치가 오르면 숫자 **위**, 상대 수치가 오르면 숫자 **아래**.
     **+숫자는 글자 아래로 줄을 바꿔** 두 줄로 놓는다 — 한 줄로 두면 가로로 길어져서
     내민 카드를 덮었다(예전에는 `white-space: nowrap`이라 칸 밖으로 그냥 넘쳐 나갔다).
     폭은 **수치와 카드 사이 빈 자리**로 제한하고 글자를 VS 쪽에 붙여, 카드 쪽으로
     넘어가지 않게 한다. 두 clamp는 각각 `.tally`와 `.played`의 가로 위치다. */
  .tally .bonus { position: absolute; width: max-content; line-height: 1.25;
                  max-width: calc(clamp(96px, 12.5vw, 176px) - clamp(46px, 5.6vw, 72px) - 6px);
                  font-size: 12px; font-weight: 700; color: var(--gold); }
  .tally .bonus b { display: block; font-size: 15px; }
  /* 내 것은 숫자 **위**로 올라가므로 아래(내 수치)를 가릴 일이 없다 */
  .tally.me .bonus { bottom: 100%; margin-bottom: 6px; right: 0; text-align: right; }
  .tally.them .bonus { top: 100%; margin-top: 6px; left: 0; text-align: left; }
  @keyframes burst { 0% { transform: scale(.4); opacity: 0; }
                     60% { transform: scale(1.15); opacity: 1; }
                     100% { transform: scale(1); opacity: 1; } }
  .tally .bonus { animation: burst .4s ease-out both; }

  /* VS / 승패 문구 — 보드 정중앙 */
  .versus { left: 0; top: 0; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: 800; color: var(--dim); letter-spacing: .08em; }
  @keyframes impact { 0% { transform: scale(0); opacity: 1; }
                      100% { transform: scale(2.6); opacity: 0; } }
  .impact { position: absolute; inset: -22px; border-radius: 50%; pointer-events: none;
            border: 3px solid var(--gold); opacity: 0; }
  .impact.go { animation: impact .5s ease-out both; }
  /* 가운데 정렬(translate -50%)을 keyframe에만 두면 애니메이션이 없을 때 글자가 오른쪽으로
     밀려 수치를 덮는다. 기본 상태에도 넣어둔다. */
  .versus .verdict { position: absolute; left: 50%; top: 50%; white-space: nowrap;
                     transform: translate(-50%, -50%);
                     font-size: clamp(22px, 2.6vw, 34px); font-weight: 900; letter-spacing: .06em;
                     opacity: 0; }
  .versus .vs-text { transition: opacity .2s; }
  .versus.decided .vs-text { opacity: 0; }
  .verdict.win { color: var(--ok); text-shadow: 0 0 26px rgba(61,220,132,.7); }
  .verdict.lose { color: var(--bad); text-shadow: 0 0 26px rgba(255,77,79,.7); }
  .verdict.draw { color: var(--dim); }
  @keyframes verdictIn { 0% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; }
                         55% { transform: translate(-50%,-50%) scale(.9); opacity: 1; }
                         100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
  .versus.decided .verdict { animation: verdictIn .4s cubic-bezier(.2,.9,.3,1.5) both; }

  .hint { color: var(--dim); font-size: 14px; text-align: center; }

  /* 카드를 고르는 동안에만 보이는 중앙 점수판. 판정 연출 중에는 `.board.clashing .stage`가
     통째로 숨기므로 따로 지울 필요가 없다 — 연출과 겹쳐 보이면 산만하다. */
  .scoreline { display: flex; flex-direction: column; align-items: center; gap: 20px;
               width: 100%; }
  /* **점수는 보드(= 패널을 뺀 화면) 정중앙에 고정한다.** 그냥 flex로 늘어놓으면 닉네임
     길이에 따라 숫자가 좌우로 밀린다. 양옆 칸을 `minmax(0, 1fr)`로 **똑같이** 나누면
     가운데 칸이 항상 정중앙에 오고, 이름은 각자 자기 칸 안에서 바깥쪽으로 자란다.
     (`1fr`만 쓰면 긴 이름이 제 칸을 넘겨 늘려버려서 가운데가 다시 밀린다.) */
  .scoreline .tally { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                      align-items: center; column-gap: 24px; width: 100%;
                      font-variant-numeric: tabular-nums; }
  .scoreline .nick { font-size: 18px; font-weight: 700;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 왼쪽(상대)은 **오른쪽 끝에 붙여** 길어지면 왼쪽으로 자라게 하고,
     오른쪽(나)은 왼쪽 끝에 붙여 오른쪽으로 자라게 한다 — 점수를 침범하지 않는다. */
  .scoreline .nick.them { color: var(--them); text-align: right; }
  .scoreline .nick.me { color: var(--me); text-align: left; }
  .scoreline .nums { font-size: 38px; font-weight: 900; letter-spacing: .06em;
                     text-align: center; }
  .scoreline .round { font-size: 17px; font-weight: 600; color: var(--dim);
                      letter-spacing: .03em; }

  /* 덱 선택 — 대전 시작 전에 3개 덱 중 하나를 고른다 (예전엔 디스코드 선택 메뉴였다) */
  .deckpick { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .deckpick h3 { margin: 0; font-size: 15px; color: var(--dim); font-weight: 600; }
  .deckrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .deckopt { border: 2px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer;
             background: var(--panel); transition: border-color .15s, transform .15s; }
  .deckopt:hover { border-color: var(--me); transform: translateY(-3px); }
  .deckopt.picked { border-color: var(--me); box-shadow: 0 0 0 2px rgba(79,140,255,.35); }
  .deckopt .dlabel { font-size: 13px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .deckopt .dcards { display: flex; gap: 4px; }
  .deckopt .dcards .card { width: 62px; }

  /* 최종 결과의 포인트 증감 */

  /* ── 최종 결과 ──────────────────────────── */
  /* 최종 결과는 **보드(= 패널을 뺀 화면) 정중앙**에 띄운다. 화면을 어둡게 덮지 않는다 —
     마지막 판의 카드가 그대로 보이는 편이 낫고, 암전은 다음 판으로 넘어가는 흐름을 끊는다. */
  .result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            z-index: 40; text-align: center; display: flex; flex-direction: column;
            align-items: center; gap: 10px;
            background: rgba(28,31,41,.97); border: 1px solid var(--line); border-radius: 16px;
            padding: 26px 40px; box-shadow: 0 18px 50px rgba(0,0,0,.55);
            animation: fadeIn .3s ease-out both; }
  .result .big { font-size: 40px; font-weight: 900; letter-spacing: .1em; line-height: 1.1; }
  .result .again { margin-top: 6px; padding: 10px 28px; border-radius: 10px; border: none;
                   background: var(--ok); color: #10121a; font-size: 15px; font-weight: 700;
                   cursor: pointer; font-family: inherit; }
  .result .again:hover { filter: brightness(1.08); }
  .result.win .big { color: var(--gold); text-shadow: 0 0 22px rgba(255,197,61,.7); }
  .result.lose .big { color: var(--bad); text-shadow: 0 0 22px rgba(255,77,79,.55); }
  .result.draw .big { color: var(--dim); }
  @keyframes resultIn { 0% { transform: scale(2.2); opacity: 0; }
                        60% { transform: scale(.94); opacity: 1; }
                        100% { transform: scale(1); } }
  .result .big { animation: resultIn .55s cubic-bezier(.2,.9,.3,1.4) both; }
  .result .line { font-size: 14px; color: var(--dim); }
  .result .delta { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .result .delta.up { color: var(--ok); } .result .delta.down { color: var(--bad); }
  .result .delta.flat { color: var(--dim); }


  /* ── 우측 패널 ──────────────────────────── */
  /* 패널은 **위에서부터 쌓는다**(가운데 정렬이 아니다) — 방 정보가 항상 같은 자리에 있어야
     눈이 헤매지 않는다. 가운데 정렬이면 항목이 하나 늘고 줄 때마다 전부 위아래로 움직인다. */
  .panel { background: var(--panel); border-left: 1px solid var(--line); padding: 14px;
           display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .panel h2 { margin: 0; font-size: 12px; color: var(--dim); font-weight: 600; }
  /* 위쪽 글자 묶음: 방 이름 · 판돈 · 남은 시간 */
  .info { display: flex; flex-direction: column; gap: 6px; }
  .roomname { font-size: 14px; font-weight: 700; }
  .timer { font-size: 13px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .wager { font-size: 13px; color: var(--gold); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
         display: inline-block; margin-right: 6px; vertical-align: middle; }
  .dot.off { background: var(--bad); }
  .status { font-size: 12px; color: var(--dim); }

  /* ── 관전자 목록: 다른 요소와 선으로 갈라두고 **이 안에서만** 스크롤한다 ──
     관전자가 늘어나도 패널 전체가 밀리거나 버튼이 화면 밖으로 나가지 않는다. */
  .specbox { flex: 1; min-height: 60px; display: flex; flex-direction: column; gap: 6px;
             border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
             padding: 10px 0; }
  .speclist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
              gap: 4px; padding-right: 2px; }
  .speclist .who { display: flex; align-items: center; gap: 6px; font-size: 13px;
                   background: var(--bg); border-radius: 6px; padding: 5px 8px; }
  .speclist .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .speclist .who .crown { color: var(--gold); font-size: 11px; flex: none; }
  .speclist .who .kick { margin-left: auto; flex: none; font-size: 10px; padding: 1px 6px;
                         border-radius: 5px; background: transparent; border: 1px solid var(--bad);
                         color: var(--bad); cursor: pointer; font-family: inherit; }
  .speclist .none { font-size: 12px; color: var(--dim); padding: 4px 2px; }

  /* ── 대기실 ─────────────────────────────────
     대결이 시작되기 전까지 보드를 덮는다. 시작하면 사라지고 그 아래 판이 드러난다. */
  /* **배경을 덮지 않는다.** 예전에는 86% 검정을 깔아 방에 들어가자마자 화면이 어두웠다 —
     배경 영상을 고르는 의미가 없었다. 자리 상자는 제 배경(--panel)이 불투명해 그대로 읽히고,
     덩그러니 놓인 글자만 그림자로 받쳐준다(밝은 영상 위의 흐린 회색은 안 읽힌다). */
  .waitroom { position: absolute; inset: 0; display: flex;
              flex-direction: column; align-items: center; justify-content: center; gap: 22px;
              padding: 24px; text-align: center; z-index: 5;
              text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.7); }
  .waitroom h2 { margin: 0; font-size: 20px; color: var(--dim); font-weight: 600; }
  .seats { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .seat { text-shadow: none; min-width: 200px; background: var(--panel); border: 2px solid var(--line);
          border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column;
          align-items: center; gap: 8px; }
  /* 자리 색은 **왼쪽/오른쪽으로 고정**한다 — 방장은 자리와 무관하게 배지로 표시한다
     (방장도 관전으로 물러날 수 있어서 자리 색으로 방장을 나타낼 수 없다). */
  .seat.s0 { border-color: var(--me); }
  .seat.s1 { border-color: var(--them); }
  .seat.empty { border-style: dashed; border-color: var(--line); color: var(--dim); }
  .seat .role { font-size: 12px; color: var(--dim); }
  .seat .who { font-size: 22px; font-weight: 700; }
  .seat.s0 .who { color: var(--me); }
  .seat.s1 .who { color: var(--them); }
  .seat .crown { font-size: 11px; color: var(--gold); }
  .seat .sit { font-size: 12px; padding: 4px 12px; border-radius: 7px; cursor: pointer;
               background: transparent; border: 1px solid var(--ok); color: var(--ok);
               font-family: inherit; }
  .seat .badge { font-size: 12px; padding: 2px 10px; border-radius: 10px;
                 border: 1px solid var(--ok); color: var(--ok); }
  .seat .kick { font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer;
                background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .vsmark { font-size: 26px; font-weight: 800; color: var(--dim); }
  .bigbtn { text-shadow: none; padding: 12px 34px; border-radius: 10px; border: none; font-size: 17px;
            font-weight: 700; cursor: pointer; background: var(--ok); color: #10121a; }
  .bigbtn.off { background: var(--line); color: var(--dim); cursor: not-allowed; }
  .bigbtn.ready { background: var(--me); color: #fff; }
  .waithint { font-size: 13px; color: var(--dim); }

  /* 방 조작 (우측 패널 아래쪽) */
  .roomctl { display: flex; flex-direction: column; gap: 8px; }
  .roomctl button { padding: 7px 0; border-radius: 7px; border: 1px solid var(--line);
                    background: transparent; color: var(--text); font-size: 13px; cursor: pointer;
                    font-family: inherit; }
  .roomctl button:hover { border-color: var(--me); color: var(--me); }
  .roomctl button.leave:hover { border-color: var(--bad); color: var(--bad); }

  /* 겹쳐 뜨는 창 (초대 / 확인) */
  /* z-index 70: 모바일 시트(60)보다 위여야 초대·추방 확인 창이 시트에 가려지지 않는다.
     `align-items: center` + `margin: auto`인 이유는 **창이 화면보다 높을 때**다 — center만
     쓰면 넘친 부분이 위로 잘려 나가 스크롤로도 닿을 수 없다(모바일에서 키보드가 올라오면
     실제로 그렇게 된다). auto 마진은 자리가 남을 때만 가운데로 밀어준다. */
  .veil { position: fixed; inset: 0; background: rgba(8,9,13,.72); display: flex;
          align-items: flex-start; justify-content: center; padding: 20px; z-index: 70;
          overflow-y: auto; }
  .dialog { margin: auto; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 18px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .dialog h3 { margin: 0; font-size: 16px; }
  .dialog .list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .dialog .list button { padding: 8px; border-radius: 7px; border: 1px solid var(--line);
                         background: transparent; color: var(--text); cursor: pointer;
                         font-size: 13px; font-family: inherit; text-align: left; }
  .dialog .list button:hover { border-color: var(--me); }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog .row button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
                        background: transparent; color: var(--text); font-size: 14px;
                        cursor: pointer; font-family: inherit; }
  .dialog .row button.primary { background: var(--bad); border-color: var(--bad); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 16px; font-size: 13px; z-index: 50; }
  .toast.bad { border-color: var(--bad); color: var(--bad); }

  /* ══ 모바일 (가로 760px 이하) ═══════════════════════════════════════════
     **이 블록은 반드시 스타일시트 맨 끝에 있어야 한다.** 특이도가 같은 규칙은 뒤에 온 쪽이
     이기므로, 앞쪽에 두면 나중에 나오는 `.panel { ... display: flex; ... }`가 그대로 덮어쓴다
     — 실제로 그래서 모바일 규칙이 통째로 죽어 있었고, 화면의 76%를 관전자 목록이 먹고
     준비/시작 버튼은 잘려서 누를 수조차 없었다(`body{overflow:hidden}`이라 스크롤도 안 된다).
     PC 화면은 이 블록 밖을 하나도 건드리지 않으므로 그대로다. */
  @media (max-width: 760px) {
    /* 위: 방 정보 바 / 아래: 보드. 패널은 아래 시트로 빠지므로 칸을 차지하지 않는다. */
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .topbar { display: flex; }
    /* PC에서는 세로로 쌓이는 방 정보를 가로로 눕힌다 */
    .topbar .info { flex-direction: row; align-items: baseline; gap: 10px; min-width: 0; }
    .topbar .roomname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .wager, .topbar .timer { flex: none; }

    /* **패널을 지우지 않고 시트로 바꾼다.** 여기에 방 나가기·초대·관전으로 물러나기·추방·
       관전자 목록이 들어 있어서, 숨기면 모바일에서 방을 빠져나갈 방법이 없어진다. */
    .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-height: 70vh;
             border-left: none; border-top: 1px solid var(--line);
             border-radius: 14px 14px 0 0;
             padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
             box-shadow: 0 -14px 34px rgba(0,0,0,.55);
             transform: translateY(101%); transition: transform .22s ease; }
    #app.sheet .panel { transform: none; }
    #app.sheet .sheetveil { display: block; }

    /* 보드는 가장자리를 아껴서 손패 다섯 장이 들어갈 폭을 번다 */
    .board { padding: 8px; }
    .rail { left: 6px; right: 6px; }
    /* 손패는 **가로로도 세로로도** 들어가야 한다. 폭 하한 64px을 고집했더니 360px 화면에서
       다섯 번째 카드가 12px 잘렸고(필요 344px / 가능 332px), 반대로 폭만 보고 키우면
       가로 모드(높이 360px)에서 위아래 손패가 서로 겹쳤다. 그래서 둘 다 막는다 —
       가로는 레일 폭을 5등분한 값, 세로는 두 줄(이름표 포함)이 보드에 들어가는 값이다. */
    .hand .card { width: min(clamp(44px, calc(20vw - 11px), 140px),
                             calc((100vh - 170px) / 3)); }

    /* 손가락 기준 최소 크기 */
    .roomctl button, .bigbtn { min-height: 44px; }
    .speclist .who .kick { min-height: 32px; padding: 4px 10px; font-size: 11px; }
    .seat .sit { min-height: 36px; }
  }

  /* ── 가로 모드처럼 **높이가 짧은** 화면 ──────────────────────────────────
     세로(375x812)에서는 손패 사이가 411px이나 남지만 가로(740x360)에서는 24px뿐이라,
     가운데 점수판(93px)이 위아래 손패를 덮었다(실측). 카드를 한 번 더 줄여 가운데를
     벌리고, 그 안에 들어갈 글자도 같이 줄인다. */
  @media (max-width: 900px) and (max-height: 480px) {
    .hand .card { width: min(clamp(40px, calc(20vw - 11px), 140px),
                             calc((100vh - 230px) / 3)); }
    .nameplate .who { font-size: clamp(14px, 2.4vw, 20px); }
    .scoreline .nums { font-size: 24px; }
    .scoreline .round { font-size: 11px; }
    .scoreline .nick { font-size: 12px; }
    .stage .hint { font-size: 11px; }
    /* 덱 선택도 세로로 3벌을 쌓으므로 카드를 줄여야 화면에 들어간다 */
    .deckopt .dcards .card { width: 40px; }
    .deckpick h3 { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 모바일에서만 보이는 상단 바. 방 정보(#info)가 여기로 **옮겨 온다**(복제가 아니다). -->
  <div class="topbar" id="topbar">
    <div class="barinfo" id="barInfo"></div>
    <button class="menubtn" id="menuBtn" type="button" aria-label="menu">&#9776;</button>
  </div>
  <div class="board" id="board">
    <video class="bgvid" id="bgvid" autoplay muted loop playsinline preload="auto"></video>
    <div class="waitroom" id="waitroom" hidden>
      <h2 id="waitTitle"></h2>
      <div class="seats">
        <div class="seat" id="seat0"></div>
        <div class="vsmark">VS</div>
        <div class="seat" id="seat1"></div>
      </div>
      <div class="waithint" id="waitLast"></div>
      <button class="bigbtn" id="actionBtn" hidden></button>
      <div class="waithint" id="waitHint"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="rail them">
      <div class="nameplate them"><span class="who" id="themName">—</span></div>
      <div class="hand them" id="themHand"></div>
    </div>
    <div class="rail me">
      <div class="hand me" id="myHand"></div>
      <div class="nameplate me"><span class="who" id="myName">—</span></div>
    </div>
  </div>
  <aside class="panel" id="panel">
    <div class="info" id="info">
      <div class="roomname" id="roomName"></div>
      <div class="wager" id="wager" hidden></div>
      <div class="timer" id="timer" hidden></div>
    </div>
    <div class="specbox">
      <h2><span class="dot" id="dot"></span><span id="specCount">—</span></h2>
      <div class="speclist" id="specList"></div>
    </div>
    <div class="roomctl">
      <button id="standBtn" hidden></button>
      <button id="inviteBtn"></button>
      <button class="leave" id="leaveBtn"></button>
    </div>
    <div class="status" id="status"></div>
  </aside>
  <div class="sheetveil" id="sheetveil"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
// **id는 이제 매치 번호가 아니라 방 번호다.** 대기실과 대결이 같은 페이지라 주소가 바뀌지 않는다.
const roomId = params.get("id");
const token = params.get("token") || "";
// **이 페이지의 id.** 새로고침하거나 창을 새로 열면 달라진다. 서버는 이걸로
// '같은 페이지의 재연결'과 '다른 창'을 구분한다 — 구분이 없으면 프록시가 연결을 끊고
// 브라우저가 자동으로 다시 붙을 때마다 "다른 창에서 접속했습니다"가 뜬다.
const CID = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

const $ = (id) => document.getElementById(id);
// 에셋 확장자는 서버 설정을 따른다 (PNG -> WebP 전환을 설정 한 줄로 되돌릴 수 있게)
let EXT = ".webp";

let labels = null;
let state = null;
let shownRound = 0;      // 이펙트를 이미 재생한 라운드 번호 (같은 스냅샷이 또 와도 두 번 안 튼다)
let timerEnd = 0;
// 판정 연출 단계(ms). 카드가 꽂히고 -> 쓰인 수치가 빛나고 -> 숫자가 뜨고 ->
// 속성 보너스가 붙고 -> 슬롯머신으로 더해지고 -> 승패가 뜬다.
// 합계는 오락실.json의 pvp_config.round_reveal_pause_seconds보다 길면 안 된다 —
// 길면 다음 라운드가 연출 위에서 시작돼 카드 고를 시간을 까먹는다.
const STEP = { glow: 480, value: 880, bonus: 1240, roll: 1620, rollStep: 190, after: 420, hold: 1200 };
let clashTimers = [];
let clashEndAt = 0;        // 판정 연출이 걷히는 시각 (최종 결과를 그 뒤로 미루는 데 쓴다)
function at(ms, fn) { clashTimers.push(setTimeout(fn, ms)); }
function clashEndsIn() { return Math.max(0, clashEndAt - Date.now()); }
function clearClashTimers() { clashTimers.forEach(clearTimeout); clashTimers = []; }

const msg = (key, vars = {}) =>
  (labels.messages[key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text ?? "";
  return d.innerHTML;
}

// 카드 한 장 = 프레임 + 일러스트 + 직업/속성 아이콘 + 능력치.
// 서버 렌더러가 그리던 것과 같은 구성이지만 브라우저가 그리므로 서버 CPU는 0이다.
function cardHtml(card, extraClass = "", glow = []) {
  if (!card) return `<div class="card ${extraClass}"><div class="art"></div></div>`;
  const base = labels.image_base_url;
  // glow에 담긴 스탯은 나중에 .glow가 붙어 빛난다 (판정에 쓰인 수치. 동점이면 여러 개)
  const stats = labels.stat_order.map(key => `
    <span class="stat st-${key}${glow.includes(key) ? " lit" : ""}" title="${esc(labels.stat_labels[key])}">
      <img src="${base}stat_icon/${key}${EXT}" alt="">${card.stats[key]}
    </span>`).join("");
  return `<div class="card ${extraClass}" data-hero="${card.hero_id}">
    <div class="art">
      <img class="frame" src="${base}card/${encodeURIComponent(card.grade)}${EXT}" alt="">
      <img class="portrait" src="${base}hero/${encodeURIComponent(card.image_name)}${EXT}" alt="">
      <img class="icon job" src="${base}job_icon/${card.job}${EXT}" alt="" title="${esc(labels.job_labels[card.job])}">
      ${card.element ? `<img class="icon elem" src="${base}element/${card.element}${EXT}" alt="" title="${esc(labels.element_labels[card.element])}">` : ""}
      <div class="cname">${esc(card.name)}</div>
      ${stats}
    </div>
  </div>`;
}

function render() {
  const s = state;
  $("themName").textContent = s.them.name;
  $("myName").textContent = s.me.name;

  // 손패: 이미 낸 카드는 빠지고 남은 카드만 정렬된다 (서버가 remaining에서 제거해준다)
  // 손패가 비면 **아무것도 적지 않는다.** 예전에는 "상대가 덱을 고르는 중" 안내를 넣었는데
  // 그게 맞는 상황이 아예 없었다 — 덱 선택 단계(phase "deck")는 따로 걸러내고 있었고,
  // 라운드 중에 상대 손패가 비었다는 건 **5장을 다 썼다**는 뜻이기 때문이다.
  // 실제로 마지막 판정 직후, finished가 켜지기 전 스냅샷에서 이 문구가 잠깐 떴다.
  $("themHand").innerHTML = s.them.remaining.map(c => cardHtml(c)).join("");

  const canPick = s.my_turn && !s.finished;
  $("myHand").innerHTML = s.me.remaining
    .map(c => cardHtml(c, canPick ? "pickable" : "")).join("");
  if (canPick) {
    for (const el of $("myHand").querySelectorAll(".card")) {
      el.onclick = () => pick(Number(el.dataset.hero), el);
    }
  }

  // 가운데 행: 덱을 아직 안 골랐으면 덱 선택, 아니면 안내 문구.
  // 판정 연출은 그 위에 겹쳐 띄웠다가 걷는다.
  if (!s.finished && s.my_decks) {
    renderDeckPick(s);
  } else {
    // 카드를 고르는 단계에서는 가운데에 점수를 띄운다 (연출 중에는 .stage가 통째로 숨는다).
    const scoreline = (s.round && !s.finished)
      ? `<div class="scoreline">
           <div class="round">${msg("web_match_round", { round: s.round, total: s.deck_size })}</div>
           <div class="tally">
             <span class="nick them">${escapeHtml(s.them.name)}</span>
             <span class="nums">${s.them.wins} : ${s.me.wins}</span>
             <span class="nick me">${escapeHtml(s.me.name)}</span>
           </div>
         </div>` : "";
    // **끝난 뒤에는 가운데를 비운다** — 결과 상자가 같은 자리에 뜨므로 글자가 겹쳐 점수를 가린다
    $("stage").innerHTML = s.finished ? "" : scoreline + `<div class="hint">${
      s.phase === "deck" ? msg("match_waiting_deck")
      : s.my_turn ? msg("web_match_pick_prompt") : msg("match_waiting_pick")}</div>`;
    if (scoreline) $("stage").classList.add("stacked"); else $("stage").classList.remove("stacked");
  }
  if (s.last_round && s.last_round.round !== shownRound) {
    showClash(s.last_round);
    shownRound = s.last_round.round;
  }

  if (s.finished) scheduleFinal(s);
  startTimer(s);
}

function renderDeckPick(s) {
  const numbers = Object.keys(s.my_decks).sort();
  $("stage").innerHTML = `
    <div class="deckpick">
      <h3>${msg("web_match_deck_prompt")}</h3>
      <div class="deckrow">
        ${numbers.map(n => `
          <div class="deckopt" data-deck="${n}">
            <div class="dlabel">${msg("web_match_deck_label", { number: n })}</div>
            <div class="dcards">${s.my_decks[n].map(c => cardHtml(c)).join("")}</div>
          </div>`).join("")}
      </div>
    </div>`;
  for (const el of $("stage").querySelectorAll(".deckopt")) {
    el.onclick = () => chooseDeck(Number(el.dataset.deck), el);
  }
}

async function chooseDeck(number, el) {
  el.classList.add("picked");
  const res = await fetch(`/api/match/deck?id=${roomId}&token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ deck_number: number }),
  });
  if (!res.ok) el.classList.remove("picked");   // 이미 골랐거나 시간이 지난 경우 되돌린다
}

function showClash(round) {
  // last_round는 도전자/상대 축으로 오므로, 내 쪽이 어느 축인지 state로 판별한다
  const mine = round.mine, theirs = round.theirs;
  const verdict = round.draw ? "draw" : mine.won ? "win" : "lose";
  const verdictText = msg(round.draw ? "web_match_draw" : mine.won ? "web_match_win" : "web_match_lose");

  const played = (d, who) => `
    <div class="played ${who} ${d.won ? "won" : round.draw ? "" : "lost"}">
      ${cardHtml(d.card, "", d.stats || [d.stat])}
      ${reasonHtml(d)}
    </div>`;
  // 수치는 아직 기본값만 보여준다 — 속성 보너스는 뒤에서 슬롯머신으로 더해진다
  const tally = (d, who) => `
    <div class="tally ${who}" hidden>
      <span class="num"><span class="digit">${d.base}</span></span>
      ${d.element_bonus ? `<div class="bonus" hidden>${esc(msg("web_match_element_bonus"))}` +
        `<b>+${d.element_bonus}</b></div>` : ""}
    </div>`;

  clearClashTimers();
  document.querySelector(".clashLayer")?.remove();
  const layer = document.createElement("div");
  layer.className = "clashLayer";
  layer.innerHTML = `
    <div class="axis">
      ${played(mine, "me")}
      ${played(theirs, "them")}
      ${tally(mine, "me")}
      <div class="versus">
        <span class="vs-text">VS</span>
        <span class="impact"></span>
        <span class="verdict ${verdict}">${verdictText}</span>
      </div>
      ${tally(theirs, "them")}
    </div>`;
  $("board").appendChild(layer);
  $("board").classList.add("clashing");

  const gap = Math.max(mine.value - mine.base, theirs.value - theirs.base);
  const rollEnd = gap > 0 ? STEP.roll + gap * STEP.rollStep : STEP.value;
  const decidedAt = rollEnd + STEP.after;

  // ① 어떤 수치를 가져왔는지 카드 위에서 빛낸다 (사제전처럼 최저값이 여럿이면 전부)
  at(STEP.glow, () => layer.querySelectorAll(".stat.lit").forEach(el => el.classList.add("glow")));
  // ② 비교 수치를 VS 양옆에 띄운다 (내 것 왼쪽 / 상대 것 오른쪽)
  at(STEP.value, () => layer.querySelectorAll(".tally").forEach(el => {
    el.hidden = false;
    el.classList.add("show");
  }));
  // ③ 왜 오르는지 먼저 보여주고 ④ 그만큼 슬롯머신으로 올린다
  at(STEP.bonus, () => layer.querySelectorAll(".bonus").forEach(el => { el.hidden = false; }));
  for (const [d, who] of [[mine, "me"], [theirs, "them"]]) {
    if (d.value === d.base) continue;
    rollNumber(layer.querySelector(`.tally.${who} .num`), d.base, d.value, STEP.roll);
  }
  // ⑤ 승패
  at(decidedAt, () => {
    layer.querySelector(".versus")?.classList.add("decided");
    layer.querySelector(".impact")?.classList.add("go");
    document.body.classList.remove("shake");
    void document.body.offsetWidth;            // 애니메이션 재시작을 위한 리플로우
    document.body.classList.add("shake");
  });

  // 걷어내고 손패를 다시 쓸 수 있게 한다 (매치가 끝났으면 최종 화면이 덮는다)
  clashEndAt = Date.now() + decidedAt + STEP.hold + 340;
  at(decidedAt + STEP.hold, () => {
    layer.classList.add("out");
    at(340, () => { layer.remove(); $("board").classList.remove("clashing"); });
  });
}

// 슬롯머신: 옛 숫자가 아래로 사라지고 다음 숫자가 위에서 내려온다 (5 -> 6 -> 7 ...)
function rollNumber(el, from, to, startAt) {
  if (!el) return;
  for (let v = from + 1; v <= to; v++) {
    at(startAt + (v - from - 1) * STEP.rollStep, () => {
      // **내보낼 숫자는 지금 맨 뒤(=직전에 들어온 것)다.** querySelector로 첫 번째를 집으면
      // 다음 칸이 190ms마다 들어오는 동안 같은 숫자를 두 번 빼려 하고, 중간 숫자들이
      // 지워지지 않은 채 쌓여 "789"처럼 보인다 (실제로 그랬다).
      const prev = el.lastElementChild;
      const next = document.createElement("span");
      next.className = "digit in";
      next.textContent = v;
      el.appendChild(next);
      if (prev) {
        prev.classList.add("out");
        at(200, () => prev.remove());
      }
    });
  }
}

function reasonHtml(detail) {
  // 어떤 스탯을 왜 썼는지 + 속성으로 얼마가 붙었는지
  const statName = labels.stat_labels[detail.stat] || detail.stat;
  const ruleKey = {
    OWN_LOWEST: "pvp_reason_own_lowest",
    BOTH_HIGHEST: "pvp_reason_both_highest",
    MATCH_OPP_LOWEST: "pvp_reason_match_opp_lowest",
  }[detail.rule] || "pvp_reason_direct";
  // 속성 보너스는 VS 옆 수치에 붙으므로 여기서는 "어떤 스탯을 왜 골랐는지"만 적는다
  const why = detail.element_bonus ? `<br>${esc(msg(detail.element_reason))}` : "";
  return `<div class="reason"><b>${esc(statName)} ${detail.base}</b><br>${esc(msg(ruleKey))}${why}</div>`;
}

let finalTimer = null;

// 마지막 판정 연출이 끝난 **2초 뒤**에 결과를 띄운다. 연출 위에 바로 겹치면 마지막 카드
// 대결을 못 보고, 연출이 걷히자마자 띄우면 너무 급하다. 연출이 없으면(시간 초과로 끝난 경우)
// 결과가 도착한 시점부터 2초를 센다.
function scheduleFinal(s) {
  if (finalTimer || document.querySelector(".result")) return;
  const clashing = $("board").classList.contains("clashing");
  const delay = clashing ? clashEndsIn() + 2000 : 2000;
  finalTimer = setTimeout(() => { finalTimer = null; showFinal(s); }, delay);
}

function showFinal(s) {
  if (document.querySelector(".result")) return;
  const kind = s.winner === "me" ? "win" : s.winner === "them" ? "lose" : "draw";
  const d = s.points_delta || 0;
  const box = document.createElement("div");
  box.className = "result " + kind;
  box.innerHTML =
    `<div class="big">${msg("web_match_final_" + kind)}</div>` +
    `<div class="line">${msg("web_match_scoreline", {
        them: escapeHtml(s.them.name), a: s.them.wins, b: s.me.wins, me: escapeHtml(s.me.name) })}</div>` +
    (s.wager
      ? `<div class="delta ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : ""}${d.toLocaleString()}P</div>`
      : "") +
    (s.end_reason ? `<div class="line">${msg(s.end_reason)}</div>` : "") +
    // **방장에게만 보인다.** 방 전체의 화면을 되돌리는 조작이고, 다음 판을 시작하는 것도
    // 방장이라 권한을 한 사람에게 모아둔다. 다른 사람에게는 버튼 자체를 그리지 않는다.
    (room && room.me.is_host
      ? `<button class="again">${escapeHtml(msg("web_match_rematch"))}</button>` : "");
  const again = box.querySelector(".again");
  if (again) again.onclick = () => { again.disabled = true; roomPost("rematch"); };
  $("board").appendChild(box);
}

function startTimer(s) {
  // 마감시각은 서버가 정해서 내려준다 — 클라이언트가 따로 재면 새로고침이나 재접속 때 어긋난다
  if (s.finished || !s.deadline) { $("timer").hidden = true; timerEnd = 0; return; }
  $("timer").hidden = false;
  timerEnd = s.deadline * 1000;
}
setInterval(() => {
  if ($("timer").hidden) { timerEnd = 0; return; }
  const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
  $("timer").textContent = `${left}s`;
}, 200);

async function pick(heroId, el) {
  el.classList.add("gone");
  timerEnd = 0;
  const res = await fetch(`/api/match/pick?id=${roomId}&token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hero_id: heroId }),
  });
  if (!res.ok) el.classList.remove("gone");   // 거절되면 되돌린다 (이미 냈거나 시간이 지난 경우)
}

// 이 매치에서 쓰일 이미지를 미리 받아둔다.
// 손패 카드에 lazy가 걸려 있으면 화면 밖 카드는 안 받아두는데, 그 카드가 판정에 나오는 순간
// 다운로드가 시작돼 연출 도중에 그림이 늦게 뜬다. 카드는 손패에서 빠지기만 하고 새로 들어오지
// 않으므로, 첫 스냅샷에 나온 것만 받아두면 매치 끝까지 충분하다.
const preloaded = new Set();
function preload(snapshot) {
  const base = labels.image_base_url;
  const urls = [];
  for (const c of [...snapshot.me.remaining, ...snapshot.them.remaining]) {
    urls.push(`${base}card/${encodeURIComponent(c.grade)}${EXT}`,
              `${base}hero/${encodeURIComponent(c.image_name)}${EXT}`,
              `${base}job_icon/${c.job}${EXT}`);
    if (c.element) urls.push(`${base}element/${c.element}${EXT}`);
  }
  for (const key of labels.stat_order) urls.push(`${base}stat_icon/${key}${EXT}`);
  for (const url of urls) {
    if (preloaded.has(url)) continue;
    preloaded.add(url);
    const img = new Image();
    img.src = url;
  }
}

// ── 방(대기실) ────────────────────────────────────────────────
let room = null;
let lastNotice = null;
let stopped = false;      // 다른 창에서 접속해 이 창이 끊긴 상태

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(text, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function goLobby() { location.href = `/lobby?token=${encodeURIComponent(token)}`; }

async function roomPost(path, body) {
  const res = await fetch(`/api/room/${path}?id=${roomId}&token=${encodeURIComponent(token)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) toast(msg("web_room_" + data.error) || data.error || "error", "bad");
  return res.ok ? data : null;
}

function renderSeat(index) {
  const el = $("seat" + index);
  const who = room.seats[index];
  const playing = room.match && !room.match.finished;
  el.className = "seat s" + index + (who ? "" : " empty");

  if (!who) {
    // 빈 자리에는 관전자가 직접 앉을 수 있다 (자리가 비는 즉시 자동으로도 채워진다)
    const canSit = room.me.seat === null && !playing;
    el.innerHTML =
      `<span class="role">${escapeHtml(msg("web_room_seat"))}</span>
       <span class="who">${escapeHtml(msg("web_room_empty_slot"))}</span>
       ${canSit ? `<button class="sit">${escapeHtml(msg("web_room_sit"))}</button>` : ""}`;
    const sit = el.querySelector(".sit");
    if (sit) sit.onclick = () => roomPost("seat", { sit: true });
    return;
  }

  // **대결 중에는 대전자를 못 내보낸다** — 지고 있을 때 판을 엎는 데 쓰일 수 있다.
  const canKick = room.me.is_host && who.id !== room.me.id && !playing;
  el.innerHTML =
    `<span class="role">${escapeHtml(msg("web_room_seat"))}</span>
     <span class="who">${escapeHtml(who.name)}</span>
     ${who.is_host ? `<span class="crown">${escapeHtml(msg("web_room_host_badge"))}</span>` : ""}
     ${who.ready ? `<span class="badge">${escapeHtml(msg("web_room_ready_done"))}</span>` : ""}
     ${canKick ? `<button class="kick">${escapeHtml(msg("web_room_kick"))}</button>` : ""}`;
  const kick = el.querySelector(".kick");
  if (kick) kick.onclick = () => confirmKick(who);
}

// 지금 걸려 있는 배경 주소. **스냅샷은 상태가 바뀔 때마다 계속 오므로**, 주소가 실제로
// 달라졌을 때만 src를 갈아야 한다 — 매번 넣으면 영상이 처음부터 다시 시작한다.
let bgUrl = null;

function renderBackground() {
  const bg = room.background;
  const video = $("bgvid");
  if (!bg || !bg.url) {                 // 배경이 없는 방(설정이 비었을 때)
    if (bgUrl !== null) { video.removeAttribute("src"); video.load(); bgUrl = null; }
    video.style.opacity = 0;
    return;
  }
  if (bg.url !== bgUrl) {
    bgUrl = bg.url;
    video.src = bg.url;
    video.play().catch(() => {});       // 자동재생이 막혀도 화면은 그대로 진행한다
  }
  // 투명도/채도는 배경마다 다르다 (밝은 영상일수록 낮다)
  video.style.opacity = bg.opacity;
  video.style.filter = `saturate(${bg.saturate})`;
}

function renderRoom() {
  renderBackground();
  $("roomName").textContent = room.name;
  // 판돈은 방이 가진 값이다. 예전에는 매치 스냅샷에서만 채워서 **대기실에서는 안 보였다**.
  $("wager").hidden = !room.wager;
  if (room.wager) $("wager").textContent = msg("web_match_wager", { wager: room.wager.toLocaleString() });
  $("inviteBtn").textContent = msg("web_room_invite");
  $("leaveBtn").textContent = msg("web_room_leave");

  const playing = room.match && !room.match.finished;
  renderSeat(0);
  renderSeat(1);

  // 관전자 목록은 **우측 패널에 따로** 그린다 (목록 안에서만 스크롤된다).
  // 방장에게는 이름마다 내보내기 버튼이 붙는다 — 대결 중에도 관전자는 내보낼 수 있다.
  const specs = room.spectators || [];
  $("specCount").textContent = msg("web_match_spectators", { count: specs.length });
  $("specList").innerHTML = specs.length
    ? specs.map((s, i) =>
        `<div class="who">
           <span class="nm">${escapeHtml(s.name)}</span>
           ${s.is_host ? `<span class="crown">${escapeHtml(msg("web_room_host_badge"))}</span>` : ""}
           ${room.me.is_host && s.id !== room.me.id
             ? `<button class="kick" data-spec="${i}">${escapeHtml(msg("web_room_kick"))}</button>` : ""}
         </div>`).join("")
    : `<div class="none">${escapeHtml(msg("web_room_spectators_empty"))}</div>`;
  for (const button of $("specList").querySelectorAll("[data-spec]")) {
    button.onclick = () => confirmKick(specs[Number(button.dataset.spec)]);
  }

  // 지난 판 결과는 대기실에 한 줄로 남는다 (결과 화면은 잠깐 뒤 대기실로 돌아간다)
  $("waitLast").textContent = room.last_result
    ? msg("web_room_last", { text: msg(room.last_result.key, room.last_result.vars) })
    : "";

  const action = $("actionBtn");
  const hint = $("waitHint");
  action.hidden = true;
  hint.textContent = "";
  const full = room.seats[0] && room.seats[1];
  $("waitTitle").textContent = msg(full ? "web_room_ready_title" : "web_room_waiting_title");

  if (room.me.is_host) {
    action.hidden = false;
    action.textContent = msg("web_room_start");
    action.className = "bigbtn" + (room.can_start ? "" : " off");
    action.disabled = !room.can_start;
    action.onclick = room.can_start ? () => roomPost("start") : null;
    if (!room.can_start) hint.textContent = msg(full ? "web_room_ready_all" : "web_room_start_hint");
  } else if (room.me.seat !== null) {
    action.hidden = false;
    action.textContent = msg(room.me.ready ? "web_room_unready" : "web_room_ready");
    action.className = "bigbtn" + (room.me.ready ? " ready" : "");
    action.disabled = false;
    action.onclick = () => roomPost("ready", { ready: !room.me.ready });
    if (room.me.ready) hint.textContent = msg("web_room_start_wait");
  } else {
    hint.textContent = msg("web_room_start_wait");
  }

  // 대전자는 언제든 관전으로 물러날 수 있다 (대결 중에는 서버가 막는다)
  $("standBtn").hidden = room.me.seat === null || playing;
  $("standBtn").textContent = msg("web_room_stand");
}

function confirmKick(who) {
  openDialog({
    title: msg("web_room_kick_confirm", { name: who.name }),
    body: "",
    confirm: msg("web_room_kick"),
    onConfirm: () => { roomPost("kick", { user_id: who.id }); closeDialog(); },
  });
}

async function openInvite() {
  const res = await fetch(`/api/room/invitable?id=${roomId}&token=${encodeURIComponent(token)}`);
  const lobby = res.ok ? await res.json() : { users: [] };
  const people = lobby.users || [];
  openDialog({
    title: msg("web_room_invite_title"),
    body: people.length
      ? `<div class="list">${people.map((u, i) =>
          `<button data-i="${i}">${escapeHtml(u.name)}</button>`).join("")}</div>`
      : `<div class="waithint">${escapeHtml(msg("web_room_invite_empty"))}</div>`,
    onReady: (dialog) => {
      for (const button of dialog.querySelectorAll("[data-i]")) {
        button.onclick = async () => {
          const person = people[Number(button.dataset.i)];
          const ok = await roomPost("invite", { user_id: person.id });
          if (ok) toast(msg("web_room_invite_sent", { name: person.name }));
          closeDialog();
        };
      }
    },
  });
}

let veil = null;
function closeDialog() { if (veil) { veil.remove(); veil = null; } }
function openDialog({ title, body, confirm, onReady, onConfirm }) {
  closeDialog();
  toggleSheet(false);
  veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML =
    `<div class="dialog">
       <h3>${escapeHtml(title)}</h3>
       ${body || ""}
       <div class="row">
         <button data-cancel>${escapeHtml(msg("web_lobby_cancel") || "Cancel")}</button>
         ${confirm ? `<button class="primary" data-ok>${escapeHtml(confirm)}</button>` : ""}
       </div>
     </div>`;
  veil.querySelector("[data-cancel]").onclick = closeDialog;
  const ok = veil.querySelector("[data-ok]");
  if (ok) ok.onclick = onConfirm;
  veil.onclick = (e) => { if (e.target === veil) closeDialog(); };
  document.body.appendChild(veil);
  if (onReady) onReady(veil.querySelector(".dialog"));
}

function applyRoom(payload) {
  if (payload.removed) {
    // 추방당했거나 방에서 빠졌다. 방 화면에 그대로 두면 아직 방에 있는 줄 안다.
    stopped = true;
    document.body.innerHTML =
      `<div style="padding:60px;text-align:center;color:#8d94a5">
         ${escapeHtml(msg(payload.removed))}</div>`;
    setTimeout(goLobby, 2200);
    return;
  }
  if (payload.kicked === "elsewhere") {
    // 같은 사람이 다른 창에서 접속했다. 창마다 스트림이 생기면 접속자 수가 부풀어서
    // 한 사람당 창 하나만 유지한다 — 이 창은 여기서 멈춘다(다시 연결하지 않는다).
    stopped = true;
    document.body.innerHTML =
      `<div style="padding:60px;text-align:center;color:#8d94a5">
         ${escapeHtml(msg("web_lobby_kicked_elsewhere"))}</div>`;
    return;
  }
  room = payload;
  // 승격/추방 같은 1회성 안내는 스냅샷에 한 번만 실려 온다
  if (payload.notice && payload.notice.key !== lastNotice) {
    lastNotice = payload.notice.key;
    toast(msg(payload.notice.key, payload.notice.vars));
  }
  if (payload.closed) {
    document.body.innerHTML =
      `<div class="notice" style="padding:60px;text-align:center;color:#8d94a5">
         ${escapeHtml(msg(payload.close_reason || "web_room_closed"))}</div>`;
    setTimeout(goLobby, 2500);
    return;
  }
  renderRoom();
  const live = payload.match;
  // 대기실로 돌아왔거나 새 판이 시작되면 지난 결과 상자를 치운다
  if (!live || !live.finished) {
    clearTimeout(finalTimer); finalTimer = null;
    document.querySelector(".result")?.remove();
  }
  $("waitroom").hidden = !!live;
  if (live) apply(live);
  else resetBoard();
}

function resetBoard() {
  // 대기실에서는 판 위에 아무것도 남기지 않는다.
  // 대기실 배경이 반투명이라 **밑에 남은 것이 그대로 비친다.** 예전에는 페이지를 열 때
  // "상대가 덱을 고르는 중" 문구를 미리 박아뒀는데, 그게 대기실 내내 뒤에 떠 있었다 —
  // 그 문구는 **내가 덱을 고른 뒤 상대가 고르기 전까지**만 맞는 말이다(render()가 `my_decks`가
  // 비었고 phase가 "deck"일 때만 띄운다). 다시 매칭으로 돌아왔을 때 지난 판 손패가 비치는 것도
  // 같은 이유로 여기서 치운다.
  $("stage").innerHTML = "";
  $("stage").classList.remove("stacked");
  $("themHand").innerHTML = "";
  $("myHand").innerHTML = "";
  $("themName").textContent = "—";
  $("myName").textContent = "—";
  $("timer").hidden = true;
}

function apply(snapshot) {
  // 서버의 last_round는 도전자/상대 축이고 화면은 나/상대 축이라 여기서 한 번만 바꿔둔다.
  // 관전자는 도전자를 '나'로 본다(서버가 is_challenger=true로 내려준다).
  const r = snapshot.last_round;
  if (r) {
    r.mine = snapshot.is_challenger ? r.challenger : r.opponent;
    r.theirs = snapshot.is_challenger ? r.opponent : r.challenger;
  }
  state = snapshot;
  preload(snapshot);
  render();
}

// ── 연결: SSE 우선, 막히면 폴링으로 내려간다 ──────────────────
let polling = null;
function setLive(ok) {
  $("dot").className = "dot" + (ok ? "" : " off");
  $("status").textContent = ok ? "" : msg("web_match_lost_connection");
}

function startPolling() {
  if (polling) return;
  setLive(false);
  // **앞 요청이 끝난 뒤에 다음 요청을 보낸다.** setInterval로 2초마다 무조건 쏘면 서버가
  // 느려졌을 때 요청이 겹쳐 쌓인다(끊긴 탭이 많을수록 더 심해진다).
  const tick = async () => {
    if (stopped || !polling) return;
    try {
      const res = await fetch(`/api/match?id=${roomId}&token=${encodeURIComponent(token)}`);
      if (res.ok) { route(await res.json()); setLive(true); } else { setLive(false); }
    } catch { setLive(false); }
    polling = setTimeout(tick, 2000);
  };
  polling = setTimeout(tick, 0);
}

function connect() {
  const source = new EventSource(
    `/api/match/stream?id=${roomId}&token=${encodeURIComponent(token)}&cid=${CID}`);
  let got = false;
  source.onmessage = (e) => { got = true; setLive(true); route(JSON.parse(e.data)); };
  source.onerror = () => {
    if (stopped) { source.close(); return; }
    // 첫 이벤트조차 못 받았으면 프록시가 스트림을 막고 있을 가능성이 크다 → 폴링으로 전환
    if (!got) { source.close(); startPolling(); } else { setLive(false); }
  };
}

// 스냅샷은 방(대기실 + 대결)으로 오지만, 폴링 경로 등에서 매치만 올 수도 있게 나눠 받는다
// ── 모바일 ────────────────────────────────────────────────────────────────
// 방 정보(이름·판돈·타이머)는 화면 폭에 따라 **같은 요소를 옮겨 다닌다.** 두 벌을 두고
// 양쪽에 그리면 렌더링 코드가 한쪽을 빠뜨리기 쉽다. 화면을 돌리면 다시 제자리로 간다.
const MOBILE = window.matchMedia("(max-width: 760px)");
function placeInfo() {
  const info = $("info"), panel = $("panel");
  if (MOBILE.matches) $("barInfo").appendChild(info);
  else panel.insertBefore(info, panel.firstElementChild);
}
MOBILE.addEventListener("change", placeInfo);

// 우측 패널은 모바일에서 아래 시트가 된다 (없애면 방을 나갈 방법이 없다)
function toggleSheet(open) {
  const app = $("app");
  app.classList.toggle("sheet", open === undefined ? !app.classList.contains("sheet") : open);
}

function route(payload) {
  if (payload && payload.type === "room") applyRoom(payload);
  else apply(payload);
}

(async function boot() {
  const res = await fetch(`/api/match/labels?token=${encodeURIComponent(token)}`);
  if (!res.ok) {
    document.body.innerHTML =
      `<div class="hint" style="padding:40px">Link expired. Press the card game button in Discord again.</div>`;
    return;
  }
  labels = await res.json();
  EXT = labels.image_ext || EXT;
  placeInfo();
  $("menuBtn").onclick = () => toggleSheet();
  $("sheetveil").onclick = () => toggleSheet(false);
  $("inviteBtn").onclick = openInvite;
  $("standBtn").onclick = () => roomPost("seat", { sit: false });
  $("leaveBtn").onclick = async () => { await roomPost("leave"); goLobby(); };
  connect();
})();
</script>
</body>
