<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<style>
  :root {
    --bg: #1b1d24; --panel: #23262f; --line: #343845; --text: #e7e9ee; --dim: #9aa0ae;
    --accent: #5865f2; --view: #2dd4bf; --ok: #3ba55d; --bad: #ed4245;
    --R: #8b96a5; --Rplus: #4fa3c7; --SR: #c9a227; --SSR: #b562d6;
  }
  * { box-sizing: border-box; }
  /* .grid{display:grid} / .history{display:flex} 같은 클래스 선택자가 브라우저 기본 [hidden]
     스타일(display:none)보다 우선순위가 높아서, !important 없이는 숨겨지지 않는다. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 12px 16px; }
  /* 상단 화면 전환 탭 — 제목이 있던 자리. 아래 덱 탭(파란 알약)과 헷갈리지 않도록
     밑줄형 + 다른 색(청록)으로 완전히 다르게 생기게 한다. */
  .viewtabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .viewtab { padding: 8px 16px 10px; border: none; background: transparent; color: var(--dim);
             cursor: pointer; font-size: 17px; font-weight: 700; border-bottom: 3px solid transparent;
             margin-bottom: -1px; }
  .viewtab:hover { color: var(--text); }
  .viewtab.active { color: var(--view); border-bottom-color: var(--view); }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
         color: var(--text); cursor: pointer; font-size: 14px; }
  .tab.active { background: var(--accent); border-color: var(--accent); }

  /* PVP 전적 */
  .history { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .match { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line);
           border-radius: 8px; padding: 10px 14px; display: flex; align-items: center;
           gap: 12px; flex-wrap: wrap; }
  .match.win { border-left-color: var(--ok); }
  .match.loss { border-left-color: var(--bad); }
  .match.draw { border-left-color: var(--dim); }
  .match.cancelled { border-left-color: var(--line); opacity: .6; }
  .result { font-weight: 700; font-size: 14px; min-width: 56px; }
  .match.win .result { color: var(--ok); }
  .match.loss .result { color: var(--bad); }
  .match.draw .result, .match.cancelled .result { color: var(--dim); }
  .vs { font-size: 13px; flex: 1; min-width: 120px; }
  .vs .dim { color: var(--dim); }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.up { color: var(--ok); } .delta.down { color: var(--bad); } .delta.flat { color: var(--dim); }
  .when { font-size: 12px; color: var(--dim); }

  /* 소환 이력 — 한 덩어리가 소환 1회(10연이면 카드 10장) */
  .summons { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .summon { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .summon-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .summon-head .count { font-size: 13px; font-weight: 600; color: var(--text); }
  .cost { font-size: 12px; color: var(--bad); }
  .refund { font-size: 12px; color: var(--SR); }
  .pulls { display: flex; gap: 8px; flex-wrap: wrap; }
  /* 덱 편성 카드(약 150px)와 원래 크기(72px)의 중간 */
  .pull { width: 110px; }
  .pull .art { border-radius: 6px; overflow: hidden; outline: 2px solid transparent; }
  .pull.new .art { outline-color: var(--ok); }
  .pull .pname { font-size: 10px; color: var(--dim); margin-top: 3px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pull .tag { font-size: 9px; padding: 1px 5px; border-radius: 8px; border: 1px solid var(--line);
               color: var(--dim); display: inline-block; margin-top: 2px; }
  .pull.new .tag { color: var(--ok); border-color: var(--ok); }
  .pull.maxed .tag { color: var(--SR); border-color: var(--SR); }
  .statusbar { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .count { font-size: 14px; color: var(--dim); }
  button.action { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
                  font-size: 14px; color: #fff; background: var(--accent); }
  button.action:disabled { background: #3a3d47; color: #6d717c; cursor: not-allowed; }
  #toast { font-size: 13px; }
  #toast.ok { color: var(--ok); } #toast.bad { color: var(--bad); }

  .filters { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .filters label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .filters select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
                     border-radius: 6px; padding: 5px 8px; font-size: 13px; }

  .grid { display: grid; gap: 12px; padding: 16px;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 10px;
          overflow: hidden; cursor: pointer; position: relative; transition: border-color .12s, transform .12s; }
  .card:hover { transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,101,242,.35); }
  /* 카드 그림은 **대전 화면(match_page.html)과 똑같은 구성**이다 —
     등급 프레임 + 일러스트 + 상단 직업/속성 아이콘 + 하단 능력치.
     좌표는 전부 512x768 프레임 대비 비율이라 카드 크기를 바꿔도 정렬이 유지된다.
     **프레임의 일러스트 영역은 투명이 아니라 불투명 텍스처**라 프레임을 깔고 그 위에
     일러스트를 올려야 한다 — 순서를 바꾸면 그림이 가려진다.
     예전에는 프레임을 뺐다(PNG 4장 2.27MB라 100px대 표시에 비해 과했다). WebP로 바꾸면서
     4장 합계 257KB가 됐고, 종류가 고정이라 카드가 몇 장이든 한 번만 받으므로 이제 쓴다.
     등급 배지도 뗐다 — 프레임 색이 등급을 말해준다. */
  /* 이름/능력치 크기를 카드 폭에 비례시키려고 cqw를 쓰므로 **.art 자신이 컨테이너**여야 한다.
     .card에만 걸면 소환 이력 카드(.pull)에는 컨테이너가 없어서 cqw가 뷰포트 기준으로 잡히고,
     스탯 아이콘이 카드 절반을 덮을 만큼 커진다 (실제로 그랬다). */
  .art { container-type: inline-size;
         position: relative; width: 100%; aspect-ratio: 512 / 768; }
  .art > * { position: absolute; }
  .art .frame { inset: 0; width: 100%; height: 100%; }
  .art .portrait { left: 7.81%; top: 11.72%; width: 84.18%; height: 50.65%; object-fit: contain; }
  .art .icon { top: 18.36%; transform: translate(-50%, -50%); }
  .art .job { left: 84.77%; width: 12.30%; }
  .art .elem { left: 15.23%; width: 14.65%; }
  .art .cname { left: 9.77%; top: 5.73%; width: 80.47%; height: 4.56%;
                display: flex; align-items: center; justify-content: center;
                font-size: 5.4cqw; font-weight: 700; color: #fff; overflow: hidden; line-height: 1;
                white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .art .stat { display: flex; align-items: center; gap: .35em;
               transform: translateY(-50%); font-size: 8cqw; color: #fff;
               text-shadow: 0 1px 2px rgba(0,0,0,.85); font-variant-numeric: tabular-nums; }
  .art .stat img { width: 6.64cqw; height: auto; }
  .art .st-attack { left: 17.07%; top: 71.85%; }
  .art .st-hp { left: 59.16%; top: 71.85%; }
  .art .st-defense { left: 17.07%; top: 79.88%; }
  .art .st-accuracy { left: 59.16%; top: 79.88%; }
  .art .st-evasion { left: 17.07%; top: 87.91%; }
  /* 강화분은 대전 화면엔 없는 정보라 작게 덧붙인다 (보유 카드 화면에서만 의미가 있다) */
  .art .plus { font-size: .62em; color: var(--ok); text-shadow: 0 1px 2px rgba(0,0,0,.9); }

  /* 선택 번호는 **왼쪽 위**. 오른쪽 위는 프레임의 직업 아이콘 자리라 겹친다
     (예전엔 아이콘이 아래쪽에 있어서 오른쪽 위가 비어 있었다). */
  .pick { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
          background: var(--accent); color: #fff; font-size: 12px; display: none;
          align-items: center; justify-content: center; }
  .card.selected .pick { display: flex; }
  /* 다른 덱에도 들어 있다는 안내. 예전에는 잠금 표시였지만 이제 막지 않고 알려주기만 한다.
     오른쪽 위는 선택 번호(.pick)가 쓰므로 왼쪽 아래에 둔다. */
  .alsomsg { position: absolute; bottom: 6px; left: 6px; font-size: 10px; background: rgba(0,0,0,.72);
             padding: 3px 6px; border-radius: 4px; color: var(--SR); }
  /* 카드 안(프레임 이름칸)에 이미 이름이 있으므로 아래에 다시 적지 않는다.
     그래서 이 칸은 **강화한 카드의 초기화 버튼이 있을 때만** 생긴다 — 늘 붙이면
     강화 안 한 카드 밑에 빈 여백만 남는다. */
  .info { padding: 8px; }
  .reset-btn { width: 100%; padding: 5px 0; border-radius: 6px; border: 1px solid var(--line);
               background: transparent; color: var(--bad); font-size: 11px; cursor: pointer; }
  .reset-btn:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="viewtabs" id="viewtabs"></div>
  <div id="deckControls">
    <div class="tabs" id="tabs"></div>
    <div class="statusbar">
      <span class="count" id="count"></span>
      <button class="action" id="save" disabled></button>
      <span id="toast"></span>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>
<div class="grid" id="grid"></div>
<div class="history" id="history" hidden></div>
<div class="summons" id="summons" hidden></div>

<script>
const token = new URLSearchParams(location.search).get("token");

let data = null;        // 서버에서 받은 전체 데이터
let currentDeck = 1;    // 지금 편집 중인 덱
let selected = [];      // 현재 덱에 고른 hero_id 목록 (순서 = 슬롯)
let filters = { element: "", grade: "", job: "" };  // ""는 "전체"

const $ = (id) => document.getElementById(id);
// 에셋 확장자는 서버 설정을 따른다 (PNG -> WebP 전환을 설정 한 줄로 되돌릴 수 있게)
let EXT = ".webp";
const msg = (key, vars = {}) =>
  (data.messages[key] || "").replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function toast(text, kind) {
  const el = $("toast");
  el.textContent = text;
  el.className = kind || "";
  setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 3000);
}

async function load() {
  const res = await fetch(`/api/deck?token=${encodeURIComponent(token)}`);
  if (!res.ok) { document.body.innerHTML = "<div class='empty'>Link expired.</div>"; return; }
  data = await res.json();
  EXT = data.image_ext || EXT;

  document.title = data.messages.web_title;
  $("save").textContent = data.messages.web_save;
  renderViewTabs();
  renderFilters();
  selectDeck(1);
  // 디스코드에서 "소환 이력 보기"로 들어오면 그 탭이 열린 채로 시작한다 (#summons / #history)
  const wanted = location.hash.slice(1);
  if (wanted === "history" || wanted === "summons") selectView(wanted);
}

// ── 화면 전환 (덱 설정 / PVP 전적) ────────────────────────────────
let view = "deck";
let history = null;   // null이면 아직 안 불러온 상태
let summons = null;

function renderViewTabs() {
  const box = $("viewtabs");
  box.innerHTML = "";
  for (const [key, label] of [["deck", data.messages.web_tab_deck],
                              ["history", data.messages.web_tab_history],
                              ["summons", data.messages.web_tab_summons]]) {
    const btn = document.createElement("button");
    btn.className = "viewtab" + (key === view ? " active" : "");
    btn.textContent = label;
    btn.onclick = () => selectView(key);
    box.appendChild(btn);
  }
}

function selectView(next) {
  view = next;
  renderViewTabs();
  $("deckControls").hidden = view !== "deck";
  $("grid").hidden = view !== "deck";
  $("history").hidden = view !== "history";
  $("summons").hidden = view !== "summons";
  // 각 이력은 탭을 처음 열 때만 받아온다 — 덱만 보고 나가는 사람에게는 조회 비용이 0
  if (view === "history" && history === null) loadHistory();
  if (view === "summons" && summons === null) loadSummons();
}

async function loadHistory() {
  $("history").innerHTML = `<div class="empty">${data.messages.web_history_loading}</div>`;
  const res = await fetch(`/api/history?token=${encodeURIComponent(token)}`);
  if (!res.ok) {
    $("history").innerHTML = `<div class="empty">${data.messages.web_expired || "Link expired."}</div>`;
    return;
  }
  history = (await res.json()).matches;
  renderHistory();
}

function renderHistory() {
  const box = $("history");
  box.innerHTML = "";
  if (!history.length) {
    box.innerHTML = `<div class="empty">${data.messages.web_history_empty}</div>`;
    return;
  }
  const labels = {
    win: data.messages.web_result_win, loss: data.messages.web_result_loss,
    draw: data.messages.web_result_draw, cancelled: data.messages.web_result_cancelled,
  };
  for (const m of history) {
    const el = document.createElement("div");
    el.className = "match " + m.result;

    const name = m.opponent_name || data.messages.web_history_unknown;
    // 판돈전만 득실을 보여준다. 친선전은 0이 아니라 '친선전'이라고 적어야 오해가 없다.
    let delta = `<span class="delta flat">${data.messages.web_history_friendly}</span>`;
    if (m.wager > 0) {
      const cls = m.delta > 0 ? "up" : m.delta < 0 ? "down" : "flat";
      const sign = m.delta > 0 ? "+" : "";
      delta = `<span class="delta ${cls}">${sign}${m.delta.toLocaleString()}P</span>`;
    }

    el.innerHTML =
      `<span class="result">${labels[m.result]}</span>` +
      `<span class="vs"><span class="dim">${data.messages.web_history_opponent}</span> ${escapeHtml(name)}</span>` +
      delta +
      `<span class="when">${new Date(m.played_at).toLocaleString()}</span>`;
    box.appendChild(el);
  }
}

async function loadSummons() {
  $("summons").innerHTML = `<div class="empty">${data.messages.web_history_loading}</div>`;
  const res = await fetch(`/api/summons?token=${encodeURIComponent(token)}`);
  if (!res.ok) {
    $("summons").innerHTML = `<div class="empty">${data.messages.web_expired}</div>`;
    return;
  }
  summons = (await res.json()).summons;
  renderSummons();
}

function renderSummons() {
  const box = $("summons");
  box.innerHTML = "";
  if (!summons.length) {
    box.innerHTML = `<div class="empty">${data.messages.web_summons_empty}</div>`;
    return;
  }
  const tags = {
    new: data.messages.web_summon_new,
    enhance: data.messages.web_summon_enhance,
    maxed: data.messages.web_summon_maxed,
  };
  for (const s of summons) {
    const el = document.createElement("div");
    el.className = "summon";

    // 소환 1회가 카드 여러 장을 담는다 (10연이면 10장) — 한 덩어리로 묶어서 보여준다
    const pulls = s.cards.map(c => {
      return `<div class="pull ${c.outcome}">` +
             cardArt(c) +
             `<div class="pname">${escapeHtml(c.name)}</div>` +
             `<span class="tag">${tags[c.outcome] || c.outcome}</span></div>`;
    }).join("");

    const cost = s.cost
      ? `<span class="cost">${msg("web_summon_cost", { points: s.cost.toLocaleString() })}</span>` : "";
    // 중복이라 포인트로 돌려받은 경우에만 환급액을 적는다
    const refund = s.refund
      ? `<span class="refund">${msg("web_summon_refund", { points: s.refund.toLocaleString() })}</span>` : "";

    el.innerHTML =
      `<div class="summon-head">` +
      `<span class="count">${msg("web_summon_count", { count: s.cards.length })}</span>` +
      cost + refund +
      `<span class="when" style="margin-left:auto">${new Date(s.pulled_at).toLocaleString()}</span>` +
      `</div><div class="pulls">${pulls}</div>`;
    box.appendChild(el);
  }
}

// 카드 그림 한 장의 마크업. 덱 편성과 소환 이력이 같이 쓰고, **대전 화면과 같은 구성**이다.
// 프레임/아이콘/스탯 아이콘은 종류가 고정이라 카드가 몇 장이든 브라우저가 한 번만 받아 캐시한다 —
// 카드 수에 비례해 늘어나는 건 일러스트뿐이다.
// `bonus`를 넘기면 강화분을 작게 덧붙인다 (덱 편성 전용. 소환 결과는 기본 스탯만 보여준다).
function cardArt(card, bonus) {
  const base = data.image_base_url;
  const stats = (data.stat_order || []).map(key => {
    const value = card.stats?.[key];
    if (value === undefined) return "";
    const gained = bonus?.[key];
    return `<span class="stat st-${key}" title="${data.stat_labels?.[key] || key}">
              <img src="${base}stat_icon/${key}${EXT}" alt="" loading="lazy">${value}${
              gained ? `<span class="plus">+${gained}</span>` : ""}</span>`;
  }).join("");
  // 프레임을 먼저 깔고 그 위에 일러스트를 올린다 (프레임의 그림칸이 불투명하다)
  return `<div class="art">
    <img class="frame" src="${base}card/${encodeURIComponent(card.grade)}${EXT}" alt="" loading="lazy">
    <img class="portrait" src="${base}hero/${encodeURIComponent(card.image_name)}${EXT}" alt="" loading="lazy">
    <img class="icon job" src="${base}job_icon/${card.job}${EXT}" alt="" title="${data.job_labels?.[card.job] || ""}" loading="lazy">
    ${card.element ? `<img class="icon elem" src="${base}element/${card.element}${EXT}" alt="" title="${data.element_labels?.[card.element] || ""}" loading="lazy">` : ""}
    <div class="cname">${escapeHtml(card.name)}</div>
    ${stats}
  </div>`;
}

// 상대 이름은 디스코드 표시 이름이라 무엇이든 들어올 수 있다 — 반드시 이스케이프해서 넣는다
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function renderFilters() {
  const groups = [
    { key: "element", label: data.messages.web_filter_element, options: data.elements, labels: data.element_labels },
    { key: "grade", label: data.messages.web_filter_grade, options: data.grades, labels: null },
    { key: "job", label: data.messages.web_filter_job, options: data.jobs, labels: data.job_labels },
  ];

  const box = $("filters");
  box.innerHTML = "";
  for (const group of groups) {
    const label = document.createElement("label");
    label.textContent = group.label;
    const select = document.createElement("select");

    const allOpt = document.createElement("option");
    allOpt.value = "";
    allOpt.textContent = data.messages.web_filter_all;
    select.appendChild(allOpt);

    for (const value of group.options) {
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = group.labels ? group.labels[value] : value;
      select.appendChild(opt);
    }

    select.onchange = () => { filters[group.key] = select.value; render(); };
    label.appendChild(select);
    box.appendChild(label);
  }
}

function visibleCards() {
  return data.cards.filter(c =>
    (!filters.element || c.element === filters.element) &&
    (!filters.grade || c.grade === filters.grade) &&
    (!filters.job || c.job === filters.job)
  );
}

function selectDeck(number) {
  currentDeck = number;
  // 이 덱에 이미 배치된 카드를 초기 선택 상태로
  selected = data.cards.filter(c => c.deck_numbers.includes(number)).map(c => c.hero_id);
  render();
}

function render() {
  // 탭
  $("tabs").innerHTML = "";
  for (let n = 1; n <= data.deck_count; n++) {
    const btn = document.createElement("button");
    btn.className = "tab" + (n === currentDeck ? " active" : "");
    btn.textContent = msg("web_deck_tab", { number: n });
    btn.onclick = () => selectDeck(n);
    $("tabs").appendChild(btn);
  }

  // 상태줄 (선택 개수는 필터와 무관하게 이 덱에 실제로 고른 카드 기준)
  $("count").textContent = msg("web_selected_count", { selected: selected.length, total: data.deck_size });
  $("save").disabled = selected.length !== data.deck_size;

  // 카드 그리드 (필터에 걸리지 않은 카드만 표시 — 이미 선택된 카드가 필터로 가려져도 선택 상태 자체는 유지됨)
  const grid = $("grid");
  grid.innerHTML = "";
  if (!data.cards.length) {
    grid.innerHTML = `<div class="empty">${data.messages.web_no_cards}</div>`;
    return;
  }

  const cards = visibleCards();
  if (!cards.length) {
    grid.innerHTML = `<div class="empty">${data.messages.web_no_matches}</div>`;
    return;
  }

  for (const card of cards) {
    // 다른 덱에 배치된 카드는 이 덱에서 못 고름 (같은 카드는 덱 하나에만)
    // 같은 카드를 여러 덱에 넣을 수 있으므로 잠그지 않는다. 다른 덱에도 들어 있으면 그 번호만 알려준다.
    const alsoIn = card.deck_numbers.filter(n => n !== currentDeck);
    const isSelected = selected.includes(card.hero_id);

    const el = document.createElement("div");
    el.className = "card" + (isSelected ? " selected" : "");

    el.innerHTML = `
      ${cardArt(card, card.bonus)}
      ${alsoIn.length ? `<span class="alsomsg">${msg("web_in_other_deck", { number: alsoIn.join(", ") })}</span>` : ""}
      <span class="pick">${selected.indexOf(card.hero_id) + 1}</span>
      ${card.enhance_count > 0
        ? `<div class="info"><button type="button" class="reset-btn">${data.messages.web_reset_enhance}</button></div>`
        : ""}`;

    el.onclick = () => toggle(card.hero_id);
    const resetBtn = el.querySelector(".reset-btn");
    if (resetBtn) resetBtn.onclick = (e) => { e.stopPropagation(); resetEnhance(card.hero_id); };
    grid.appendChild(el);
  }
}

async function resetEnhance(heroId) {
  if (!confirm(data.messages.web_reset_enhance_confirm)) return;
  const res = await fetch(`/api/deck/reset-enhance?token=${encodeURIComponent(token)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hero_id: heroId }),
  });
  const body = await res.json();
  if (!res.ok) { toast(msg("web_reset_enhance_failed", { reason: body.error }), "bad"); return; }

  const refreshed = await fetch(`/api/deck?token=${encodeURIComponent(token)}`);
  if (refreshed.ok) data.cards = (await refreshed.json()).cards;
  toast(data.messages.web_reset_enhance_done, "ok");
  render();
}

function toggle(heroId) {
  const at = selected.indexOf(heroId);
  if (at >= 0) {
    selected.splice(at, 1);
  } else if (selected.length >= data.deck_size) {
    toast(msg("web_full", { total: data.deck_size }), "bad");
    return;
  } else {
    selected.push(heroId);
  }
  render();
}

$("save").onclick = async () => {
  const res = await fetch(`/api/deck?token=${encodeURIComponent(token)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ deck_number: currentDeck, hero_ids: selected }),
  });
  const body = await res.json();
  if (!res.ok) { toast(msg("web_save_failed", { reason: body.error }), "bad"); return; }

  // 저장된 배치를 화면 데이터에도 반영 (다른 덱 탭에서 잠금 표시가 정확해지도록)
  for (const card of data.cards) {
    card.deck_numbers = card.deck_numbers.filter(n => n !== currentDeck);
    if (selected.includes(card.hero_id)) card.deck_numbers = [...card.deck_numbers, currentDeck].sort();
  }
  toast(data.messages.web_saved, "ok");
  render();
};

load();
</script>
</body>
</html>
